<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Blocko Meet</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: #050505; 
      color: #ffffff;
      overflow: hidden; /* Запрещаем скролл страницы */
      user-select: none;
    }
    
    /* Скрываем системные скроллбары для красоты */
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    /* Зеркалирование локальной камеры */
    .mirror-video { transform: scaleX(-1); }

    /* Анимация пульсации говорящего */
    @keyframes speak-pulse {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); border-color: rgba(59, 130, 246, 1); }
      70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); border-color: rgba(59, 130, 246, 0.5); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); border-color: rgba(59, 130, 246, 0.2); }
    }
    .is-speaking { animation: speak-pulse 2s infinite; z-index: 10; border: 2px solid #3b82f6 !important; }

    /* CSS ТРАНСФОРМАЦИИ ДЛЯ УЧАСТНИКОВ */
    /* Базовый стиль видео-контейнера */
    .peer-container {
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      border-radius: 1.5rem;
      overflow: hidden;
      position: relative;
      background-color: #111827;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* Состояние: Закреплен (Spotlight) */
    .peer-container.is-pinned {
      width: 100%;
      height: 100%;
      flex-shrink: 1;
      border-radius: 2rem;
      border: none;
      cursor: default;
      order: -1; /* Всегда первый */
    }

    /* Состояние: В ленте снизу (Gallery) */
    .peer-container.is-gallery {
      width: 110px;
      height: 150px;
    }
    @media (min-width: 640px) {
      .peer-container.is-gallery { width: 140px; height: 190px; }
    }

    /* Внешний вид плеера внутри контейнера */
    .peer-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0; left: 0;
    }

    .glass-bar {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(15, 23, 42, 0.75);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="h-screen w-full flex flex-col relative" id="appWrapper">

  <!-- Фон (Глубокий космос) -->
  <div class="absolute top-0 left-0 w-full h-1/2 bg-blue-600/10 blur-[100px] pointer-events-none -z-10"></div>
  <div class="absolute bottom-0 right-0 w-full h-1/2 bg-indigo-600/10 blur-[100px] pointer-events-none -z-10"></div>

  <!-- ШАПКА -->
  <header id="topHeader" class="absolute top-0 left-0 w-full h-20 px-4 sm:px-6 flex items-center justify-between z-50 bg-gradient-to-b from-black/90 to-transparent transition-transform duration-300">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-blue-500/20 text-blue-500 rounded-xl flex items-center justify-center border border-blue-500/30 shadow-lg">
        <i data-lucide="video" class="w-5 h-5"></i>
      </div>
      <div class="flex flex-col">
        <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-2">
          Blocko Meet
          <span class="px-1.5 py-0.5 rounded text-[8px] font-black bg-blue-500 text-white uppercase tracking-widest">PRO</span>
        </h1>
        <div class="flex items-center gap-1.5 text-[10px] text-gray-400 font-mono mt-0.5">
          <span class="relative flex h-1.5 w-1.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span></span>
          <span id="roomTime">00:00</span> • End-to-End
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-3">
      <button onclick="toggleFullscreen()" class="p-2.5 bg-white/5 hover:bg-white/10 rounded-xl transition-all border border-transparent hover:border-white/10 text-gray-300 hover:text-white" title="На весь экран">
        <i data-lucide="maximize" id="fsIcon" class="w-5 h-5"></i>
      </button>
      <button onclick="leaveCall()" class="p-2.5 bg-white/5 hover:bg-red-500/20 rounded-xl transition-all border border-transparent hover:border-red-500/50 text-gray-400 hover:text-red-500" title="Завершить звонок">
        <i data-lucide="phone-off" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- РАБОЧАЯ ОБЛАСТЬ (ВИДЕО) -->
  <main class="flex-1 flex flex-col relative z-10 w-full h-full p-2 sm:p-4 pt-20 pb-28 gap-4" id="videoLayout">
    
    <!-- ЗАКРЕПЛЕННОЕ ВИДЕО (Spotlight Area) -->
    <div id="spotlightArea" class="flex-1 w-full h-full relative overflow-hidden rounded-[2rem] shadow-2xl bg-black border border-white/5 flex items-center justify-center">
        <!-- Сюда с помощью JS будет помещаться закрепленный участник -->
        <div class="absolute inset-0 flex flex-col items-center justify-center opacity-30 pointer-events-none">
            <i data-lucide="loader-2" class="w-12 h-12 text-blue-500 animate-spin mb-4"></i>
            <span class="text-xs font-bold uppercase tracking-widest text-gray-400">Подключение потоков...</span>
        </div>
    </div>

    <!-- ЛЕНТА УЧАСТНИКОВ (Gallery Strip) -->
    <div class="w-full flex-shrink-0 relative z-20">
      <div id="galleryArea" class="flex gap-3 overflow-x-auto hide-scroll pb-2 px-1 snap-x">
          <!-- Сюда с помощью JS будут помещаться остальные участники -->
      </div>
    </div>

    <!-- Встроенный полупрозрачный чат (Появляется справа) -->
    <div id="meetChatOverlay" class="absolute right-4 top-4 bottom-32 w-72 sm:w-80 bg-black/30 hover:bg-black/85 backdrop-blur-md border border-white/5 hover:border-white/10 rounded-[2rem] transition-all duration-500 opacity-40 hover:opacity-100 flex flex-col z-40 translate-x-[120%] overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-white/5 flex justify-between items-center bg-white/5">
        <h3 class="text-sm font-bold text-white flex items-center gap-2"><i data-lucide="message-square" class="w-4 h-4 text-blue-400"></i> Чат встречи</h3>
        <button onclick="toggleMeetChat()" class="text-gray-400 hover:text-white transition-colors p-1 bg-white/5 rounded-lg"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      
      <div id="meetChatMessages" class="flex-1 overflow-y-auto p-4 space-y-3 hide-scroll text-sm flex flex-col">
        <div class="text-center text-[10px] text-gray-500 uppercase tracking-widest mt-2 mb-2 font-bold">E2EE Зашифровано</div>
      </div>
      
      <div class="p-3 border-t border-white/5 flex flex-col gap-2 bg-white/5">
        <div class="flex gap-2 justify-end px-1">
          <button onclick="sendMeetReaction('up')" class="p-1.5 rounded-full bg-white/5 hover:bg-emerald-500/20 text-gray-400 hover:text-emerald-400 transition-colors shadow-sm"><i data-lucide="thumbs-up" class="w-4 h-4"></i></button>
          <button onclick="sendMeetReaction('down')" class="p-1.5 rounded-full bg-white/5 hover:bg-red-500/20 text-gray-400 hover:text-red-400 transition-colors shadow-sm"><i data-lucide="thumbs-down" class="w-4 h-4"></i></button>
        </div>
        <div class="flex gap-2">
          <input type="text" id="meetChatInput" onkeypress="if(event.key==='Enter') sendMeetMessage()" placeholder="Написать..." class="flex-1 bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white outline-none focus:border-blue-500/50 transition-colors placeholder-gray-500" />
          <button onclick="sendMeetMessage()" class="p-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition-colors shadow-lg active:scale-95"><i data-lucide="send" class="w-4 h-4"></i></button>
        </div>
      </div>
    </div>

    <!-- Модальное окно приглашения -->
    <div id="inviteModal" class="hidden fixed inset-0 z-[1000] flex items-center justify-center bg-black/80 backdrop-blur-sm opacity-0 transition-opacity duration-300 px-4">
      <div class="bg-[#111827] border border-gray-800 p-8 rounded-[2rem] w-full max-w-md text-center transform scale-95 transition-transform shadow-2xl relative" id="inviteContent">
        <button onclick="closeInviteModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white transition-colors p-2"><i data-lucide="x" class="w-5 h-5"></i></button>
        <div class="w-16 h-16 bg-blue-500/20 text-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-5 border border-blue-500/30">
          <i data-lucide="user-plus" class="w-8 h-8"></i>
        </div>
        <h2 class="text-xl font-bold text-white mb-2">Пригласить коллег</h2>
        <p class="text-xs text-gray-400 mb-6 leading-relaxed">Отправьте эту ссылку участникам доски. Они смогут мгновенно присоединиться к текущей конференции.</p>
        
        <div class="flex items-center gap-2 bg-[#0B0F19] border border-gray-700 rounded-xl p-2 mb-2 shadow-inner">
          <input type="text" id="inviteLinkInput" readonly class="flex-1 bg-transparent text-xs text-gray-300 outline-none px-2 font-mono truncate" value="">
          <button onclick="copyInviteLink()" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition-colors font-bold text-xs shadow-md active:scale-95 flex gap-2 items-center"><i data-lucide="copy" class="w-3.5 h-3.5"></i> Скопировать</button>
        </div>
        <div id="inviteCopyStatus" class="text-[10px] text-emerald-500 font-bold h-4 transition-all opacity-0">Скопировано в буфер обмена!</div>
      </div>
    </div>
    
  </main>

  <!-- ПАНЕЛЬ УПРАВЛЕНИЯ ЗВОНКОМ -->
  <footer id="bottomFooter" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-50 glass-bar rounded-[2rem] px-3 sm:px-6 py-3 sm:py-4 flex items-center gap-2 sm:gap-4 shadow-2xl transition-transform duration-300 w-[95%] sm:w-auto justify-center">
    
    <button id="btnMic" onclick="toggleMic()" class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-white/10 text-white hover:bg-white/20 flex items-center justify-center transition-all border border-white/5 shadow-sm active:scale-95 group">
      <i data-lucide="mic" id="iconMic" class="w-5 h-5 sm:w-6 sm:h-6 group-hover:scale-110 transition-transform"></i>
    </button>
    
    <button id="btnCam" onclick="toggleCam()" class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-white/10 text-white hover:bg-white/20 flex items-center justify-center transition-all border border-white/5 shadow-sm active:scale-95 group">
      <i data-lucide="video" id="iconCam" class="w-5 h-5 sm:w-6 sm:h-6 group-hover:scale-110 transition-transform"></i>
    </button>
    
    <div class="w-px h-8 bg-white/10 mx-1 sm:mx-2"></div>
    
    <button id="btnScreen" onclick="toggleScreenShare()" class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-white/5 text-gray-400 hover:text-indigo-400 hover:bg-indigo-500/20 hover:border-indigo-500/30 flex items-center justify-center transition-all border border-transparent shadow-sm active:scale-95" title="Поделиться экраном">
      <i data-lucide="monitor-up" class="w-5 h-5 sm:w-6 sm:h-6"></i>
    </button>

    <button id="btnMeetChat" onclick="toggleMeetChat()" class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-white/5 text-gray-400 hover:text-blue-400 hover:bg-blue-500/20 hover:border-blue-500/30 flex items-center justify-center transition-all border border-transparent shadow-sm active:scale-95 relative" title="Чат конференции">
      <i data-lucide="message-square" class="w-5 h-5 sm:w-6 sm:h-6"></i>
      <span id="meetChatBadge" class="hidden absolute top-2 right-2 w-2.5 h-2.5 bg-blue-500 rounded-full border-2 border-[#0B0F19]"></span>
    </button>

    <div class="w-px h-8 bg-white/10 mx-1 sm:mx-2 hidden sm:block"></div>

    <button onclick="leaveCall()" class="hidden sm:flex px-8 h-14 rounded-2xl bg-red-600 hover:bg-red-500 text-white items-center justify-center transition-all shadow-lg shadow-red-500/30 active:scale-95 font-bold gap-2 border border-red-500/50">
      Завершить
    </button>
  </footer>

  <script>
    lucide.createIcons();

    /**
     * BLOCKO WEBRTC MESH ENGINE v6.0 (ULTIMATE ENTERPRISE)
     * Решена проблема зависания лоадера, реализована 100% гранулярная синхронизация 
     * состояний элементов без перерисовок[cite: 5, 6].
     */
    let participants = [];
    let pinnedUserId = null;
    let localStream = null;
    let peersUnsubscribe = null;
    const peerConnections = {}; 
    const rtcConfig = { 'iceServers': [{'urls': 'stun:stun.l.google.com:19302'}] };
    
    const urlParams = new URLSearchParams(window.location.search);
    const BOARD_ID = urlParams.get('b');
    const db = window.opener?.db || (typeof firebase !== 'undefined' ? firebase.firestore() : null);
    const currentUser = window.opener?.currentUser;

    if (!db || !currentUser || !BOARD_ID) {
        alert("Критическая ошибка: Потеряна сессия авторизации или база данных. Перезайдите во встречу.");
        window.close();
    }

    async function initLocalCamera() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, 
                audio: true 
            });
            await broadcastPresence(true, true);
            document.getElementById('btnMic').disabled = false;
            document.getElementById('btnCam').disabled = false;
        } catch (err) {
            console.error("Медиа-ошибка:", err);
            await broadcastPresence(false, true); // Fallback: режим "Только слушатель"
        }
        subscribeToPeers();
    }

    async function broadcastPresence(camOn, micOn) {
        const localData = {
            uid: currentUser.id,
            name: currentUser.name,
            avatar: currentUser.customAvatar || currentUser.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentUser.name),
            camOn: camOn,
            micOn: micOn,
            lastSeen: firebase.firestore.FieldValue.serverTimestamp()
        };
        await db.collection("boards").doc(BOARD_ID).collection("meet_peers").doc(currentUser.id).set(localData);
    }

    function subscribeToPeers() {
        if (peersUnsubscribe) peersUnsubscribe();
        
        peersUnsubscribe = db.collection("boards").doc(BOARD_ID).collection("meet_peers").onSnapshot((snapshot) => {
            snapshot.docChanges().forEach(async (change) => {
                const data = change.doc.data();
                const uid = data.uid;
                const isMe = uid === currentUser.id;

                if (change.type === "added") {
                    const newPeer = {
                        id: uid,
                        name: data.name,
                        isLocal: isMe,
                        stream: isMe ? localStream : new MediaStream(),
                        micOn: data.micOn,
                        camOn: data.camOn,
                        avatar: data.avatar,
                        isSpeaking: false
                    };
                    participants.push(newPeer);

                    // WebRTC Инициализация
                    if (!isMe) {
                        const pc = new RTCPeerConnection(rtcConfig);
                        peerConnections[uid] = pc;

                        if (localStream) {
                            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                        }

                        pc.ontrack = event => {
                            event.streams[0].getTracks().forEach(track => newPeer.stream.addTrack(track));
                            const vidEl = document.getElementById(`vid_${uid}`);
                            if (vidEl && vidEl.srcObject !== newPeer.stream) vidEl.srcObject = newPeer.stream;
                        };

                        pc.onicecandidate = event => {
                            if (event.candidate) {
                                db.collection("boards").doc(BOARD_ID).collection("meet_signals").add({
                                    target: uid, sender: currentUser.id, candidate: event.candidate.toJSON()
                                });
                            }
                        };

                        if (currentUser.id > uid) {
                            const offer = await pc.createOffer();
                            await pc.setLocalDescription(offer);
                            db.collection("boards").doc(BOARD_ID).collection("meet_signals").add({
                                target: uid, sender: currentUser.id, offer: { type: offer.type, sdp: offer.sdp }
                            });
                        }
                    }
                }

                if (change.type === "modified") {
                    const peer = participants.find(p => p.id === uid);
                    if (peer) {
                        peer.micOn = data.micOn;
                        peer.camOn = data.camOn;
                    }
                }

                if (change.type === "removed") {
                    participants = participants.filter(p => p.id !== uid);
                    if (peerConnections[uid]) {
                        peerConnections[uid].close();
                        delete peerConnections[uid];
                    }
                    if (pinnedUserId === uid) pinnedUserId = null;
                }
            });

            if (!pinnedUserId || !participants.find(p => p.id === pinnedUserId)) {
                pinnedUserId = participants.find(p => p.isLocal)?.id || participants[0]?.id;
            }

            requestAnimationFrame(() => updateUI());
        });

        // Сигнальный сервер WebRTC
        db.collection("boards").doc(BOARD_ID).collection("meet_signals")
            .where("target", "==", currentUser.id)
            .onSnapshot(snapshot => {
                snapshot.docChanges().forEach(async change => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        const pc = peerConnections[data.sender];
                        if (!pc) return;

                        if (data.offer) {
                            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                            const answer = await pc.createAnswer();
                            await pc.setLocalDescription(answer);
                            db.collection("boards").doc(BOARD_ID).collection("meet_signals").add({
                                target: data.sender, sender: currentUser.id, answer: { type: answer.type, sdp: answer.sdp }
                            });
                        } else if (data.answer) {
                            await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                        } else if (data.candidate) {
                            await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                        }
                        
                        change.doc.ref.delete().catch(() => {});
                    }
                });
            });
    }

    function createPeerElement(peer, isPinned) {
        const div = document.createElement('div');
        div.className = `peer-container ${isPinned ? 'is-pinned absolute inset-0' : 'is-gallery snap-center hover:border-blue-500/50 relative'} ${peer.isSpeaking ? 'is-speaking' : ''}`;
        div.dataset.id = peer.id;
        
        // Кэшируем внутреннее состояние в dataset для гранулярной проверки изменений[cite: 6]
        div.dataset.cam = peer.camOn;
        div.dataset.mic = peer.micOn;
        div.dataset.pinned = isPinned;

        if (!isPinned) {
            div.onclick = () => { pinnedUserId = peer.id; updateUI(); };
        }

        let mediaHtml = '';
        if (peer.camOn) {
            mediaHtml = `<video id="vid_${peer.id}" class="peer-video ${peer.isLocal ? 'mirror-video' : ''}" autoplay playsinline ${peer.isLocal ? 'muted' : ''}></video>`;
        } else {
            const avatarSize = isPinned ? 'w-32 h-32' : 'w-14 h-14';
            mediaHtml = `
                <div class="absolute inset-0 bg-[#0F172A] flex flex-col items-center justify-center gap-4 transition-colors duration-500">
                    <div class="relative">
                        <img src="${peer.avatar}" class="${avatarSize} rounded-full object-cover shadow-2xl border-2 border-white/10 ring-8 ring-white/5 transition-all duration-500" />
                        ${!peer.micOn ? '<div class="absolute -bottom-1 -right-1 bg-red-600 p-1.5 rounded-full border-2 border-[#0F172A] shadow-lg"><i data-lucide="mic-off" class="w-3 h-3 text-white"></i></div>' : ''}
                    </div>
                    ${isPinned ? `<span class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-500 animate-pulse">Камера выключена</span>` : ''}
                </div>`;
        }

        const micStatus = peer.micOn 
            ? '' 
            : `<div class="p-1 bg-red-500/20 rounded-md border border-red-500/30 backdrop-blur-md"><i data-lucide="mic-off" class="w-3 h-3 text-red-500"></i></div>`;

        const infoOverlay = `
            <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between pointer-events-none z-20">
            <div class="px-2.5 py-1.5 bg-black/60 backdrop-blur-xl rounded-xl border border-white/10 flex items-center gap-2 max-w-[80%] shadow-lg">
                <span class="text-[10px] font-bold text-white truncate">${peer.isLocal ? 'Вы' : peer.name}</span>
            </div>
            ${micStatus}
            </div>
        `;

        const shadow = `<div class="absolute inset-x-0 bottom-0 h-1/4 bg-gradient-to-t from-black/60 to-transparent pointer-events-none z-10"></div>`;

        div.innerHTML = mediaHtml + shadow + infoOverlay;

        // Монтаж видео потока
        if (peer.camOn && peer.stream) {
            setTimeout(() => {
                const vidEl = div.querySelector('video');
                if (vidEl && vidEl.srcObject !== peer.stream) vidEl.srcObject = peer.stream;
            }, 50);
        }

        return div;
    }

    function updateUI() {
        const spotlightArea = document.getElementById('spotlightArea');
        const galleryArea = document.getElementById('galleryArea');
        if (!spotlightArea || !galleryArea) return;

        // ЭНТЕРПРАЙЗ ФИКС: Агрессивное физическое удаление лоадера из DOM[cite: 5, 6]
        const loaderEl = spotlightArea.querySelector('.pointer-events-none:not(.peer-container)');
        if (loaderEl && participants.length > 0) loaderEl.remove();

        // Гранулярное обновление узлов (без полного перерендера innerHTML)[cite: 5, 6]
        participants.forEach(peer => {
            const isPinned = peer.id === pinnedUserId;
            const targetContainer = isPinned ? spotlightArea : galleryArea;
            
            let peerNode = document.querySelector(`.peer-container[data-id="${peer.id}"]`);
            
            if (!peerNode) {
                peerNode = createPeerElement(peer, isPinned);
                targetContainer.appendChild(peerNode);
            } else {
                // Если элемент сменил локацию (например, его закрепили)
                if (peerNode.parentNode !== targetContainer) {
                    targetContainer.appendChild(peerNode);
                }
                
                // Обновляем визуальные классы
                peerNode.className = `peer-container ${isPinned ? 'is-pinned absolute inset-0' : 'is-gallery snap-center hover:border-blue-500/50 relative'} ${peer.isSpeaking ? 'is-speaking' : ''}`;
                
                // Проверяем, изменились ли критические медиа-состояния с прошлого рендера
                const currentCam = peerNode.dataset.cam === 'true';
                const currentMic = peerNode.dataset.mic === 'true';
                const currentPinned = peerNode.dataset.pinned === 'true';

                if (currentCam !== peer.camOn || currentMic !== peer.micOn || currentPinned !== isPinned) {
                    // Точечный ребилд внутренностей карточки, если статус изменился
                    const newNode = createPeerElement(peer, isPinned);
                    peerNode.innerHTML = newNode.innerHTML;
                    
                    // Обновляем стейт в DOM
                    peerNode.dataset.cam = peer.camOn;
                    peerNode.dataset.mic = peer.micOn;
                    peerNode.dataset.pinned = isPinned;

                    if (peer.camOn && peer.stream) {
                        setTimeout(() => {
                            const vidEl = peerNode.querySelector('video');
                            if (vidEl && vidEl.srcObject !== peer.stream) vidEl.srcObject = peer.stream;
                        }, 50);
                    }
                }
            }
        });

        // Сборка мусора: безопасное удаление узлов отключившихся пользователей[cite: 6]
        document.querySelectorAll('.peer-container[data-id]').forEach(node => {
            const uid = node.getAttribute('data-id');
            if (!participants.find(p => p.id === uid)) {
                node.remove();
            }
        });

        // Контроль кнопки-слота для новых приглашений
        let inviteBtn = document.getElementById('inviteSlotNode');
        if (participants.length < 12) {
            if (!inviteBtn) {
                inviteBtn = document.createElement('div');
                inviteBtn.id = 'inviteSlotNode';
                inviteBtn.onclick = () => {
                    const modal = document.getElementById('inviteModal');
                    if(modal) modal.classList.remove('hidden');
                };
                inviteBtn.className = "peer-container is-gallery snap-center border-2 border-dashed border-blue-500/30 bg-blue-500/5 flex flex-col items-center justify-center hover:bg-blue-500/10 hover:border-blue-500/50 transition-all cursor-pointer relative";
                inviteBtn.innerHTML = `
                    <i data-lucide="user-plus" class="w-6 h-6 text-blue-400 mb-2 pointer-events-none"></i>
                    <span class="text-[9px] font-black uppercase text-blue-400 tracking-tighter pointer-events-none">Позвать</span>
                `;
                galleryArea.appendChild(inviteBtn);
            } else if (inviteBtn.parentNode !== galleryArea) {
                galleryArea.appendChild(inviteBtn);
            }
        } else if (inviteBtn) {
            inviteBtn.remove();
        }

        requestAnimationFrame(() => lucide.createIcons());
    }

    window.addEventListener('beforeunload', async () => {
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        if (db && currentUser) {
            await db.collection("boards").doc(BOARD_ID).collection("meet_peers").doc(currentUser.id).delete();
        }
    });

    // ЭНТЕРПРАЙЗ: Продвинутый конструктор узла участника с поддержкой WebRTC и состояний потока
    function createPeerElement(peer, isPinned) {
      const div = document.createElement('div');
      div.className = `peer-container ${isPinned ? 'is-pinned' : 'is-gallery snap-center hover:border-blue-500/50'} ${peer.isSpeaking ? 'is-speaking' : ''}`;
      div.dataset.id = peer.id;

      if (!isPinned) div.onclick = () => pinParticipant(peer.id);

      // ЭНТЕРПРАЙЗ: Динамическое переключение медиа-движка (Video vs Avatar)
      let mediaHtml = '';
      if (peer.camOn && peer.stream) {
          mediaHtml = `<video id="vid_${peer.id}" class="peer-video ${peer.isLocal ? 'mirror-video' : ''}" autoplay playsinline ${peer.isLocal ? 'muted' : ''}></video>`;
      } else {
          const avatarSize = isPinned ? 'w-32 h-32' : 'w-14 h-14';
          mediaHtml = `
            <div class="absolute inset-0 bg-[#0F172A] flex flex-col items-center justify-center gap-4 transition-colors duration-500">
                <div class="relative">
                    <img src="${peer.avatar}" class="${avatarSize} rounded-full object-cover shadow-2xl border-2 border-white/10 ring-8 ring-white/5 transition-all duration-500" />
                    ${!peer.micOn ? '<div class="absolute -bottom-1 -right-1 bg-red-600 p-1.5 rounded-full border-2 border-[#0F172A] shadow-lg"><i data-lucide="mic-off" class="w-3 h-3 text-white"></i></div>' : ''}
                </div>
                ${isPinned ? `<span class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-500 animate-pulse">Камера выключена</span>` : ''}
            </div>`;
      }

      const micStatus = peer.micOn 
        ? (peer.isSpeaking ? `<div class="flex gap-0.5 items-end h-3 mb-1">${[1,2,3].map(()=>'<div class="w-0.5 bg-blue-500 animate-bounce" style="animation-duration:0.5s"></div>').join('')}</div>` : '') 
        : `<div class="p-1 bg-red-500/20 rounded-md border border-red-500/30 backdrop-blur-md"><i data-lucide="mic-off" class="w-3 h-3 text-red-500"></i></div>`;

      const infoOverlay = `
        <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between pointer-events-none">
          <div class="px-2.5 py-1.5 bg-black/60 backdrop-blur-xl rounded-xl border border-white/10 flex items-center gap-2 max-w-[80%] shadow-lg">
             <span class="text-[10px] font-bold text-white truncate">${peer.isLocal ? 'Вы' : peer.name}</span>
          </div>
          ${micStatus}
        </div>
      `;

      const shadow = `<div class="absolute inset-x-0 bottom-0 h-1/4 bg-gradient-to-t from-black/60 to-transparent pointer-events-none"></div>`;

      div.innerHTML = mediaHtml + shadow + infoOverlay;

      if (peer.camOn && peer.stream) {
          setTimeout(() => {
              const vidEl = document.getElementById(`vid_${peer.id}`);
              if (vidEl && vidEl.srcObject !== peer.stream) vidEl.srcObject = peer.stream;
          }, 50);
      }

      lucide.createIcons({ root: div });
      return div;
    }

    // ЭНТЕРПРАЙЗ: Глобальное завершение сессии при выходе последнего участника (или инициатора)
    async function leaveCall() {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      
      const boardId = new URLSearchParams(window.location.search).get('b');
      // Если я инициатор, удаляем запись о звонке из базы
      if (boardId && participants.find(p => p.id === 'local')?.isInitiator) {
         try {
             // Используем Firebase напрямую (конфиг должен быть доступен)
             const db = window.opener?.db || firebase.firestore();
             await db.collection("boards").doc(boardId).update({
                activeConference: firebase.firestore.FieldValue.delete()
             });
         } catch(e) {}
      }
      window.close();
    }

    // Действие: Закрепить пользователя
    function pinParticipant(id) {
        pinnedUserId = id;
        updateUI();
    }

    // --- УПРАВЛЕНИЕ ЛОКАЛЬНЫМИ КНОПКАМИ ---
    function toggleMic() {
      const local = participants.find(p => p.id === 'local');
      if (!local) return;

      local.micOn = !local.micOn;
      if (localStream && localStream.getAudioTracks()[0]) {
          localStream.getAudioTracks()[0].enabled = local.micOn;
      }

      const btn = document.getElementById('btnMic');
      const icon = document.getElementById('iconMic');

      if (local.micOn) {
        btn.classList.remove('bg-red-500/20', 'text-red-500', 'hover:bg-red-500/30', 'border-red-500/30');
        btn.classList.add('bg-white/10', 'text-white', 'hover:bg-white/20', 'border-white/5');
        icon.setAttribute('data-lucide', 'mic');
      } else {
        btn.classList.remove('bg-white/10', 'text-white', 'hover:bg-white/20', 'border-white/5');
        btn.classList.add('bg-red-500/20', 'text-red-500', 'hover:bg-red-500/30', 'border-red-500/30');
        icon.setAttribute('data-lucide', 'mic-off');
      }
      lucide.createIcons();
      updateUI();
    }

    function toggleCam() {
      const local = participants.find(p => p.id === 'local');
      if (!local) return;

      local.camOn = !local.camOn;
      if (localStream && localStream.getVideoTracks()[0]) {
          localStream.getVideoTracks()[0].enabled = local.camOn;
      }

      const btn = document.getElementById('btnCam');
      const icon = document.getElementById('iconCam');

      if (local.camOn) {
        btn.classList.remove('bg-red-500/20', 'text-red-500', 'hover:bg-red-500/30', 'border-red-500/30');
        btn.classList.add('bg-white/10', 'text-white', 'hover:bg-white/20', 'border-white/5');
        icon.setAttribute('data-lucide', 'video');
      } else {
        btn.classList.remove('bg-white/10', 'text-white', 'hover:bg-white/20', 'border-white/5');
        btn.classList.add('bg-red-500/20', 'text-red-500', 'hover:bg-red-500/30', 'border-red-500/30');
        icon.setAttribute('data-lucide', 'video-off');
      }
      lucide.createIcons();
      updateUI();
    }

    // --- FULLSCREEN LOGIC ---
    let isFullscreen = false;
    function toggleFullscreen() {
      const wrapper = document.getElementById('appWrapper');
      const fsIcon = document.getElementById('fsIcon');

      if (!document.fullscreenElement) {
          // Запрашиваем полный экран ОС
          document.documentElement.requestFullscreen().catch(err => {
            console.log(`Ошибка перехода в полный экран: ${err.message}`);
          });
      } else {
          // Выходим из полного экрана ОС
          if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // Слушаем системное событие смены полного экрана, чтобы обновить UI
    document.addEventListener('fullscreenchange', () => {
        const fsIcon = document.getElementById('fsIcon');
        const header = document.getElementById('topHeader');
        
        if (document.fullscreenElement) {
            isFullscreen = true;
            fsIcon.setAttribute('data-lucide', 'shrink');
            // В полноэкранном режиме скрываем верхнюю шапку для фокусировки
            header.classList.add('-translate-y-full');
        } else {
            isFullscreen = false;
            fsIcon.setAttribute('data-lucide', 'maximize');
            header.classList.remove('-translate-y-full');
        }
        lucide.createIcons();
    });

    function leaveCall() {
      if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
      }
      window.close();
    }

    window.addEventListener('beforeunload', () => {
      if (localStream) localStream.getTracks().forEach(track => track.stop());
    });

    // --- ДЕМОНСТРАЦИЯ ЭКРАНА (WebRTC) ---
    let screenStream = null;
    let isScreenSharing = false;

    async function toggleScreenShare() {
      const btn = document.getElementById('btnScreen');
      const videoEl = document.getElementById('localVideo'); // Если наше видео в фокусе или в ленте
      
      // Ищем наше видео где бы оно ни было отрендерено
      const allVideos = document.querySelectorAll('video');
      let myVideo = null;
      allVideos.forEach(v => { if (v.srcObject === localStream || v.srcObject === screenStream) myVideo = v; });

      if (!isScreenSharing) {
        try {
          // Запрашиваем доступ к захвату экрана (Нативное API браузера)
          screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
          isScreenSharing = true;

          // Подменяем поток в локальной карточке
          if (myVideo) {
             myVideo.srcObject = screenStream;
             // Отключаем зеркалирование для экрана (иначе текст будет задом наперед!)
             myVideo.classList.remove('mirror-video');
          }
          const localPeer = participants.find(p => p.id === 'local');
          if (localPeer) localPeer.stream = screenStream;

          // Стилизуем кнопку (Активное состояние)
          btn.classList.add('bg-indigo-500/20', 'text-indigo-400', 'border-indigo-500/50');
          btn.classList.remove('bg-white/5', 'text-gray-400', 'border-transparent');

          // Слушатель: Если пользователь закроет доступ через системную кнопку браузера "Остановить"
          screenStream.getVideoTracks()[0].onended = () => {
             stopScreenShare();
          };
        } catch (err) {
          console.log("Доступ к экрану отменен или не поддерживается:", err);
        }
      } else {
        stopScreenShare();
      }
    }

    function stopScreenShare() {
      if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
        screenStream = null;
      }
      isScreenSharing = false;

      // Возвращаем поток с веб-камеры
      const localPeer = participants.find(p => p.id === 'local');
      if (localPeer) localPeer.stream = localStream;
      
      const allVideos = document.querySelectorAll('video');
      allVideos.forEach(v => { 
          if (!v.srcObject || v.srcObject.id === (screenStream ? screenStream.id : null)) {
              v.srcObject = localStream;
              v.classList.add('mirror-video'); // Возвращаем зеркало для лица
          }
      });

      // Сбрасываем стиль кнопки
      const btn = document.getElementById('btnScreen');
      btn.classList.remove('bg-indigo-500/20', 'text-indigo-400', 'border-indigo-500/50');
      btn.classList.add('bg-white/5', 'text-gray-400', 'border-transparent');
    }

    // --- ПРОЗРАЧНЫЙ ЧАТ ---
    let isMeetChatOpen = false;
    
    function toggleMeetChat() {
      const chatOverlay = document.getElementById('meetChatOverlay');
      const badge = document.getElementById('meetChatBadge');
      isMeetChatOpen = !isMeetChatOpen;
      
      if(isMeetChatOpen) {
        chatOverlay.classList.remove('translate-x-[120%]');
        if(badge) badge.classList.add('hidden'); // Скрываем индикатор
      } else {
        chatOverlay.classList.add('translate-x-[120%]');
      }
    }

    function sendMeetMessage() {
      const input = document.getElementById('meetChatInput');
      const text = input.value.trim();
      if(!text) return;
      
      const container = document.getElementById('meetChatMessages');
      container.innerHTML += `
        <div class="mb-2 self-end max-w-[85%]">
          <div class="bg-blue-600 text-white text-xs px-3 py-2 rounded-2xl rounded-tr-sm shadow-md break-words">${text}</div>
          <div class="text-[9px] text-gray-500 text-right mt-1">Вы</div>
        </div>`;
      
      input.value = '';
      container.scrollTop = container.scrollHeight;
    }

    function sendMeetReaction(type) {
      const container = document.getElementById('meetChatMessages');
      const icon = type === 'up' ? 'thumbs-up' : 'thumbs-down';
      const color = type === 'up' ? 'text-emerald-400' : 'text-red-400';
      const bgColor = type === 'up' ? 'bg-emerald-500/20 border-emerald-500/30' : 'bg-red-500/20 border-red-500/30';
      
      container.innerHTML += `
        <div class="mb-2 self-end">
          <div class="inline-flex p-2.5 rounded-full ${bgColor} border backdrop-blur-md shadow-lg">
            <i data-lucide="${icon}" class="w-5 h-5 ${color} fill-current animate-bounce"></i>
          </div>
        </div>`;
      
      lucide.createIcons({ root: container });
      container.scrollTop = container.scrollHeight;
    }

    // Имитация входящего сообщения от коллеги
    setTimeout(() => {
        const container = document.getElementById('meetChatMessages');
        const badge = document.getElementById('meetChatBadge');
        if(!container) return;
        
        container.innerHTML += `
        <div class="mb-2 self-start max-w-[85%]">
          <div class="bg-gray-800/80 text-gray-200 text-xs px-3 py-2 rounded-2xl rounded-tl-sm shadow-md border border-gray-700 break-words backdrop-blur-md">Ребята, всем привет! Начинаем через 2 минуты, ждем Елену.</div>
          <div class="text-[9px] text-gray-500 text-left mt-1">Александр (Lead)</div>
        </div>`;
        
        if(!isMeetChatOpen && badge) badge.classList.remove('hidden');
        if(isMeetChatOpen) container.scrollTop = container.scrollHeight;
    }, 5000);

    // Секундомер конференции
    let secondsElapsed = 0;
    setInterval(() => {
        secondsElapsed++;
        const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
        const s = (secondsElapsed % 60).toString().padStart(2, '0');
        document.getElementById('roomTime').innerText = `${m}:${s}`;
    }, 1000);

    // Запуск приложения
    initLocalCamera();

  </script>
</body>
</html>
