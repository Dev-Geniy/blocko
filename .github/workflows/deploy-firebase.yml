# Деплой правил базы (Firestore Rules) и, по желанию, Cloud Functions в Firebase.
# Запускается сам при изменениях в functions/ или firestore.rules в main,
# а также вручную: Actions → «Деплой сервера (Firebase)» → Run workflow.
#
# Правила публикуются на бесплатном тарифе (Spark) — Blaze для них не нужен.
# Cloud Functions требуют Blaze, поэтому включаются только переменной репозитория
# DEPLOY_FUNCTIONS = true (Settings → Secrets and variables → Actions → Variables).
# Без Blaze сервер оплаты работает на Cloudflare — см. deploy-api-cloudflare.yml.
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT — JSON-ключ сервисного аккаунта Firebase (обязательно)
#   PAYPAL_CLIENT_ID, PAYPAL_SECRET — ключи PayPal (только для Cloud Functions)
name: Деплой сервера (Firebase)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: blocko-pro

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Проверка ключа
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Без ключа деплой не выполняем, но и не «краснеем»: сайт (GitHub Pages) обновляется независимо
          if [ -z "$SA" ]; then
            echo "::warning::Секрет FIREBASE_SERVICE_ACCOUNT не задан — сервер не обновлён. Инструкция: DEPLOY.md, раздел «Автодеплой через GitHub»."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          # Строгие правила включаем, только когда сервер уже работает (Cloudflare или Cloud Functions),
          # иначе вход в доски по ссылке перестанет работать
          API_URL=$(node -e 'try{process.stdout.write(JSON.parse(require("fs").readFileSync("api-endpoint.json","utf8")).url||"")}catch(e){}')
          if [ "${{ vars.DEPLOY_FUNCTIONS }}" = "true" ]; then
            echo "functions=true" >> "$GITHUB_OUTPUT"; echo "rules=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$API_URL" ]; then
            echo "functions=false" >> "$GITHUB_OUTPUT"; echo "rules=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Сервер оплаты ещё не запущен (api-endpoint.json пуст) — правила не опубликованы. Сначала запустите «Деплой API (Cloudflare)»."
            echo "functions=false" >> "$GITHUB_OUTPUT"; echo "rules=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Установка зависимостей
        if: steps.key.outputs.functions == 'true'
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Тесты
        if: steps.key.outputs.functions == 'true'
        working-directory: functions
        run: npm test

      - name: Секреты PayPal
        if: steps.key.outputs.functions == 'true'
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_SECRET: ${{ secrets.PAYPAL_SECRET }}
        run: |
          if [ -n "$PAYPAL_CLIENT_ID" ] && [ -n "$PAYPAL_SECRET" ]; then
            printf '%s' "$PAYPAL_CLIENT_ID" | npx --yes firebase-tools@13 functions:secrets:set PAYPAL_CLIENT_ID --data-file=- --project "$FIREBASE_PROJECT" --force --non-interactive
            printf '%s' "$PAYPAL_SECRET" | npx --yes firebase-tools@13 functions:secrets:set PAYPAL_SECRET --data-file=- --project "$FIREBASE_PROJECT" --force --non-interactive
          else
            echo "::warning::Секреты PayPal не заданы — оплата не заработает, пока вы не добавите PAYPAL_CLIENT_ID и PAYPAL_SECRET."
            # Без секретов деплой функций упадёт, поэтому создаём заглушки (только если секрета ещё нет)
            for NAME in PAYPAL_CLIENT_ID PAYPAL_SECRET; do
              if ! npx --yes firebase-tools@13 functions:secrets:get "$NAME" --project "$FIREBASE_PROJECT" --non-interactive >/dev/null 2>&1; then
                printf 'not-configured' | npx --yes firebase-tools@13 functions:secrets:set "$NAME" --data-file=- --project "$FIREBASE_PROJECT" --force --non-interactive
              fi
            done
          fi

      - name: Деплой функций (нужен Blaze)
        if: steps.key.outputs.functions == 'true'
        run: npx --yes firebase-tools@13 deploy --only functions --project "$FIREBASE_PROJECT" --force --non-interactive

      - name: Публикация правил базы
        if: steps.key.outputs.rules == 'true'
        run: |
          # Ключу Firebase по умолчанию не хватает права на правила (403). Это не ошибка сайта:
          # правила публикуются вручную (DEPLOY.md, шаг 7) или автоматически после выдачи роли
          # «Firebase Rules Admin» сервисному аккаунту. Поэтому не «краснеем», а предупреждаем.
          if ! npx --yes firebase-tools@13 deploy --only firestore:rules --project "$FIREBASE_PROJECT" --force --non-interactive; then
            echo "::warning::Правила базы не опубликованы автоматически (нет прав у ключа). Опубликуйте вручную: Firebase Console → Firestore Database → Rules → вставьте firestore.rules → Publish. Или выдайте ключу роль «Firebase Rules Admin» (DEPLOY.md, шаг 7)."
          fi

      - name: Удалить ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
