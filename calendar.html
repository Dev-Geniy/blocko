<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Глобальный Календарь — Blocko Pro</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Анимации загрузки */
    @keyframes block-stretch {
      0%, 100% { transform: scaleX(1); opacity: 0.5; }
      50% { transform: scaleX(2.5); opacity: 1; }
    }
    .loader-block { animation: block-stretch 1.2s ease-in-out infinite; }
    .delay-200 { animation-delay: 0.2s; }
    .delay-400 { animation-delay: 0.4s; }

    /* Drag & Drop Стили */
    .sortable-ghost { opacity: 0.4; transform: scale(0.95); border: 2px dashed #8b5cf6; background: rgba(139, 92, 246, 0.1); }
    .sortable-drag { cursor: grabbing !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3); transform: rotate(2deg) scale(1.05); z-index: 100; }
    
    /* Анимация обновления сетки */
    @keyframes fadeInScale {
      from { opacity: 0.5; transform: scale(0.99); }
      to { opacity: 1; transform: scale(1); }
    }
    .grid-animate { animation: fadeInScale 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* ENTERPRISE: Жесткая фиксация вьюпорта для мобильных устройств */
    html, body {
      height: 100dvh;
      width: 100%;
      min-height: 100dvh; /* Гарантируем высоту минимум на весь экран */
      overflow-y: auto;   /* Разрешаем вертикальный скролл */
      -webkit-overflow-scrolling: touch; /* Плавный скролл на iOS */
    }
  </style>

  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { gray: { 750: '#2d3748', 850: '#1a202c', 900: '#0f172a', 950: '#0b0f19' } } } } }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 h-[100dvh] max-h-[100dvh] flex flex-col overflow-hidden transition-colors duration-300">
<!-- ПРЕМИАЛЬНЫЙ ЭКРАН ЗАГРУЗКИ -->
<div id="globalLoader" class="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-white dark:bg-gray-950 transition-all duration-700">
  <div class="flex flex-col items-center scale-110">
    <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-4 rounded-3xl text-white shadow-2xl shadow-indigo-500/40 mb-6">
      <i data-lucide="calendar-days" class="w-12 h-12"></i>
    </div>
    <h2 class="text-3xl font-black tracking-tighter mb-10">CALENDAR <span class="text-indigo-500">PRO</span></h2>
    <div class="flex gap-2 h-1.5 w-48 overflow-hidden rounded-full bg-gray-100 dark:bg-gray-800 relative">
       <div class="loader-block absolute top-0 left-0 h-full w-12 bg-indigo-500 rounded-full"></div>
       <div class="loader-block delay-200 absolute top-0 left-12 h-full w-12 bg-purple-500 rounded-full"></div>
       <div class="loader-block delay-400 absolute top-0 left-24 h-full w-12 bg-indigo-400 rounded-full"></div>
    </div>
  </div>
</div>

<!-- Неоновые блики -->
<div class="absolute top-0 left-1/4 w-[500px] h-[500px] bg-indigo-500/10 rounded-full blur-[120px] pointer-events-none -z-10"></div>
<div class="absolute bottom-0 right-1/4 w-[500px] h-[500px] bg-purple-500/10 rounded-full blur-[120px] pointer-events-none -z-10"></div>

<header class="px-8 py-5 border-b border-gray-200 dark:border-gray-800 bg-white/70 dark:bg-gray-900/70 backdrop-blur-xl sticky top-0 z-50 flex justify-between items-center">
  <div class="flex items-center gap-4">
    <a href="index.html" class="p-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all text-gray-500 active:scale-95" title="На главную">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </a>
    <div>
      <h1 class="text-xl font-bold tracking-tight">Глобальный Календарь</h1>
      <p class="text-[10px] text-indigo-500 font-bold uppercase tracking-widest mt-0.5 flex items-center gap-1.5">
        <i data-lucide="calendar" class="w-3.5 h-3.5"></i> Дедлайны со всех досок
      </p>
    </div>
  </div>

  <div class="flex items-center gap-4">
    <button onclick="fetchCalendarTasks()" class="hidden sm:flex items-center gap-2 px-4 py-2.5 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 font-bold text-xs rounded-xl transition-all shadow-sm active:scale-95">
      <i data-lucide="refresh-cw" class="w-4 h-4"></i> Синхронизация
    </button>
    <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-400 transition-colors shadow-sm">
      <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i><i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
    </button>
  </div>
</header>

<main class="p-4 sm:p-8 max-w-[1500px] mx-auto w-full flex-1 flex flex-col h-[calc(100vh-85px)]">
  
  <!-- Панель управления календарем -->
  <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4 bg-white/50 dark:bg-gray-900/50 p-4 rounded-3xl border border-gray-200 dark:border-gray-800 shadow-sm backdrop-blur-md">
    
    <!-- Переключатель Месяцев -->
    <div class="flex items-center gap-2 bg-gray-100 dark:bg-gray-800 p-1.5 rounded-2xl">
      <button onclick="changeMonth(-1)" class="p-2 rounded-xl text-gray-500 hover:bg-white dark:hover:bg-gray-700 hover:text-indigo-500 transition-all shadow-sm"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
      <h2 id="currentMonthYear" class="text-lg font-black text-gray-900 dark:text-white w-40 text-center tracking-tight">Загрузка...</h2>
      <button onclick="changeMonth(1)" class="p-2 rounded-xl text-gray-500 hover:bg-white dark:hover:bg-gray-700 hover:text-indigo-500 transition-all shadow-sm"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
    </div>

    <!-- Smart Фильтры -->
    <div class="flex items-center gap-2 bg-white/50 dark:bg-gray-900/50 p-1.5 rounded-2xl border border-gray-100 dark:border-gray-800 shadow-inner overflow-x-auto hide-scroll w-full sm:w-auto">
      <button onclick="setFilter('all')" class="filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-gray-900 text-white dark:bg-white dark:text-gray-900 shadow-sm transition-all whitespace-nowrap" data-filter="all">
        Все задачи
      </button>
      <button onclick="setFilter('critical')" class="filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-transparent text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 transition-all whitespace-nowrap flex items-center gap-1.5 opacity-60 hover:opacity-100" data-filter="critical">
        <i data-lucide="zap" class="w-3.5 h-3.5 fill-current"></i> Критичные
      </button>
      <button onclick="setFilter('high')" class="filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-transparent text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-900/30 transition-all whitespace-nowrap flex items-center gap-1.5 opacity-60 hover:opacity-100" data-filter="high">
        <i data-lucide="arrow-up-from-line" class="w-3.5 h-3.5"></i> Высокий
      </button>
    </div>

    <!-- Режимы и Сегодня -->
    <div class="flex items-center gap-3">
      <button onclick="goToToday()" class="px-5 py-2.5 bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600 dark:text-indigo-400 font-bold text-xs uppercase tracking-widest rounded-xl hover:bg-indigo-100 dark:hover:bg-indigo-900/40 transition-all shadow-sm border border-indigo-200 dark:border-indigo-800/50 active:scale-95 whitespace-nowrap">
        Сегодня
      </button>
    </div>
  </div>

  <!-- Сетка календаря -->
  <div class="flex-1 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-3xl sm:rounded-[2.5rem] shadow-xl overflow-hidden flex flex-col relative z-10">
    <div class="w-full flex-1 flex flex-col h-full overflow-hidden">
       <div class="w-full flex-1 flex flex-col h-full">
          
          <!-- Заголовки дней недели -->
          <div class="grid grid-cols-7 border-b border-gray-200 dark:border-gray-800 bg-gray-50/80 dark:bg-gray-800/50 backdrop-blur-md">
            <div class="py-3 text-center text-[10px] font-black uppercase tracking-widest text-gray-400 border-r border-gray-200 dark:border-gray-800">Пн</div>
            <div class="py-3 text-center text-[10px] font-black uppercase tracking-widest text-gray-400 border-r border-gray-200 dark:border-gray-800">Вт</div>
            <div class="py-3 text-center text-[10px] font-black uppercase tracking-widest text-gray-400 border-r border-gray-200 dark:border-gray-800">Ср</div>
            <div class="py-3 text-center text-[10px] font-black uppercase tracking-widest text-gray-400 border-r border-gray-200 dark:border-gray-800">Чт</div>
            <div class="py-3 text-center text-[10px] font-black uppercase tracking-widest text-gray-400 border-r border-gray-200 dark:border-gray-800">Пт</div>
            <div class="py-3 text-center text-[10px] font-black uppercase tracking-widest text-rose-400 border-r border-gray-200 dark:border-gray-800 bg-rose-50/30 dark:bg-rose-900/10 shadow-inner">Сб</div>
            <div class="py-3 text-center text-[10px] font-black uppercase tracking-widest text-rose-400 bg-rose-50/30 dark:bg-rose-900/10 shadow-inner">Вс</div>
          </div>

          <!-- Ячейки дней -->
          <div id="calendarGrid" class="flex-1 grid grid-cols-7 grid-rows-5 bg-gray-200 dark:bg-gray-800 gap-px">
             <!-- Рендерится через JS -->
          </div>

       </div>
    </div>
  </div>

</main>

<div id="dayViewModal" class="hidden fixed inset-0 z-[300] flex items-end sm:items-center justify-center bg-gray-900/60 dark:bg-black/80 glass-modal opacity-0 transition-opacity duration-300 sm:px-4">
  <div class="bg-white dark:bg-gray-900 w-full sm:max-w-lg h-[85vh] sm:h-auto sm:max-h-[85vh] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col transform translate-y-full sm:translate-y-0 sm:scale-95 transition-transform duration-300" id="dayViewContent">
    <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full mx-auto mt-3 mb-2 sm:hidden"></div>
    <div class="flex justify-between items-center px-6 py-4 border-b border-gray-100 dark:border-gray-800">
      <div>
        <h3 id="modalDayTitle" class="text-xl font-black text-gray-900 dark:text-white"></h3>
        <p id="modalDaySubtitle" class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest mt-0.5">Расписание</p>
      </div>
      <button onclick="closeDayModal()" class="p-2 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500 rounded-full transition-colors active:scale-95"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="modalDayTasks" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3 hide-scroll bg-gray-50/50 dark:bg-gray-950/50">
      </div>
  </div>
</div>
  
<div id="quickAddModal" class="hidden fixed inset-0 z-[400] flex items-end sm:items-center justify-center bg-gray-900/60 dark:bg-black/80 glass-modal opacity-0 transition-opacity duration-300 sm:px-4">
  <div class="bg-white dark:bg-gray-900 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col transform translate-y-full sm:translate-y-0 sm:scale-95 transition-transform duration-300 p-6 sm:p-8" id="quickAddContent">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h3 class="text-xl font-black text-gray-900 dark:text-white">Новая задача</h3>
        <p id="quickAddDateText" class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest mt-0.5"></p>
      </div>
      <button onclick="closeQuickAddModal()" class="p-2 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500 rounded-full transition-colors active:scale-95"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    
    <div class="space-y-4">
      <div>
        <input id="quickAddTitle" type="text" placeholder="Что нужно сделать?" onkeypress="if(event.key==='Enter') confirmQuickAddTask()" class="w-full px-0 py-2 bg-transparent text-lg font-bold outline-none border-b-2 border-gray-100 dark:border-gray-800 focus:border-indigo-500 dark:text-white transition-all placeholder-gray-400" />
      </div>
      
      <div>
        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-2">Куда сохранить?</label>
        <div class="grid grid-cols-2 gap-3">
          <select id="quickAddBoard" onchange="updateQuickAddColumns()" class="w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm font-bold text-gray-700 dark:text-gray-300 outline-none cursor-pointer focus:ring-2 focus:ring-indigo-500 transition-all appearance-none truncate text-center">
            <option value="">Проект...</option>
          </select>
          <select id="quickAddColumn" class="w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm font-bold text-gray-700 dark:text-gray-300 outline-none cursor-pointer focus:ring-2 focus:ring-indigo-500 transition-all appearance-none truncate text-center disabled:opacity-50">
            <option value="">Колонка...</option>
          </select>
        </div>
      </div>
      
      <div>
        <textarea id="quickAddDesc" placeholder="Пара слов о задаче (опционально)..." rows="2" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm outline-none dark:text-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all resize-none"></textarea>
      </div>
    </div>
    
    <div class="mt-8 flex gap-3">
      <button onclick="closeQuickAddModal()" class="flex-1 py-3.5 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 font-bold rounded-2xl transition-colors">Отмена</button>
      <button id="btnQuickSave" onclick="confirmQuickAddTask()" class="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl shadow-lg shadow-indigo-500/30 active:scale-95 transition-all flex items-center justify-center gap-2"><i data-lucide="plus" class="w-4 h-4 pointer-events-none"></i> Создать</button>
    </div>
  </div>
</div>
  
<!-- Пуш Уведомления -->
<div id="globalToast" class="fixed bottom-6 right-6 z-[800] transform translate-y-24 opacity-0 transition-all duration-500 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-4 rounded-2xl shadow-2xl flex items-start gap-4 max-w-sm pointer-events-none">
  <div id="toastIconBg" class="p-2.5 rounded-full flex-shrink-0 bg-blue-50 dark:bg-blue-900/30"><i id="toastIcon" data-lucide="info" class="w-5 h-5 text-blue-500"></i></div>
  <div><h4 id="toastTitle" class="text-sm font-bold text-gray-900 dark:text-white mb-1">Уведомление</h4><p id="toastDesc" class="text-xs text-gray-500 leading-relaxed"></p></div>
</div>

<script>
  // Инициализация темы
  if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
  function toggleTheme() {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
  }
  lucide.createIcons();

  let currentUser = null;
  let allTasks = []; // Все задачи с дедлайном
  let currentViewDate = new Date(); // Месяц, который сейчас отображается
  let sortableZones = [];
  let currentFilter = 'all'; // Глобальный фильтр приоритетов

  auth.onAuthStateChanged(async (user) => {
    const loader = document.getElementById('globalLoader');
    if (user) {
      currentUser = user;
      await fetchCalendarTasks();
      
      loader.style.opacity = '0';
      setTimeout(() => loader.classList.add('hidden'), 700);
    } else {
      window.location.href = 'index.html';
    }
  });

  // Логика Фильтров
  function setFilter(filterType) {
      currentFilter = filterType;
      
      // Обновляем UI кнопок
      document.querySelectorAll('.filter-btn').forEach(btn => {
          if (btn.dataset.filter === filterType) {
              btn.classList.remove('bg-transparent', 'opacity-60');
              if (filterType === 'all') btn.classList.add('bg-gray-900', 'text-white', 'dark:bg-white', 'dark:text-gray-900', 'shadow-sm');
              if (filterType === 'critical') btn.classList.add('bg-rose-50', 'dark:bg-rose-900/30', 'border', 'border-rose-200', 'dark:border-rose-800/50');
              if (filterType === 'high') btn.classList.add('bg-amber-50', 'dark:bg-amber-900/30', 'border', 'border-amber-200', 'dark:border-amber-800/50');
          } else {
              btn.classList.add('opacity-60');
              // Сбрасываем активные стили
              if (btn.dataset.filter === 'all') btn.classList.remove('bg-gray-900', 'text-white', 'dark:bg-white', 'dark:text-gray-900', 'shadow-sm');
              else btn.classList.remove('bg-rose-50', 'dark:bg-rose-900/30', 'bg-amber-50', 'dark:bg-amber-900/30', 'border', 'border-rose-200', 'dark:border-rose-800/50', 'border-amber-200', 'dark:border-amber-800/50');
              btn.classList.add('bg-transparent');
          }
      });

      // Перерисовываем с анимацией
      const grid = document.getElementById('calendarGrid');
      grid.classList.remove('grid-animate');
      void grid.offsetWidth; // Триггер reflow для перезапуска анимации
      grid.classList.add('grid-animate');
      
      renderCalendar();
  }

  // Извлечение всех задач из Firebase и LocalStorage
  async function fetchCalendarTasks() {
      if (!currentUser) return;
      allTasks = [];
      const loader = document.getElementById('globalLoader');
      if (loader.classList.contains('hidden')) {
          showSystemToast('Синхронизация...', 'Собираем задачи со всех проектов.', 'loader-2', 'text-indigo-500 animate-spin', 'bg-indigo-50 dark:bg-indigo-900/30');
      }

      // 1. ОФЛАЙН ДОСКИ (Local Storage)
      const localBoards = JSON.parse(localStorage.getItem('blocko_local_boards')) || {};
      Object.values(localBoards).forEach(board => {
          if (board.columns) {
              board.columns.forEach(col => {
                  if (col.cards) {
                      col.cards.forEach(card => {
                          if (card.dueDate && !card.archived) {
                              allTasks.push({
                                  ...card,
                                  boardId: board.id,
                                  boardTitle: board.title,
                                  colId: col.id,
                                  isLocal: true,
                                  priority: card.priority || 'normal' // Нормализация приоритета
                              });
                          }
                      });
                  }
              });
          }
      });

      // 2. ОБЛАЧНЫЕ ДОСКИ (Firestore)
      if (navigator.onLine) {
          try {
              const boardsSnap = await db.collection("boards").where("members", "array-contains", currentUser.uid).get();
              
              const fetchPromises = boardsSnap.docs.map(async (bDoc) => {
                  const boardId = bDoc.id;
                  const boardData = bDoc.data();
                  
                  const cardsSnap = await db.collection("boards").doc(boardId).collection("cards").where("archived", "==", false).get();
                  
                  cardsSnap.forEach(cDoc => {
                      const card = cDoc.data();
                      if (card.dueDate) {
                          allTasks.push({
                              ...card,
                              id: cDoc.id,
                              boardId: boardId,
                              boardTitle: boardData.title,
                              colId: card.columnId,
                              isLocal: false,
                              priority: card.priority || 'normal'
                          });
                      }
                  });
              });

              await Promise.all(fetchPromises);
              if (loader.classList.contains('hidden')) {
                 showSystemToast('Успех', 'Синхронизация завершена.', 'check-circle', 'text-emerald-500', 'bg-emerald-50 dark:bg-emerald-900/30');
              }
          } catch (e) {
              console.error("Calendar fetch error:", e);
              showSystemToast('Внимание', 'Не удалось загрузить часть облачных задач.', 'alert-triangle', 'text-amber-500', 'bg-amber-50 dark:bg-amber-900/30');
          }
      }

      renderCalendar();
  }

  // --- ЛОГИКА КАЛЕНДАРЯ ---
  function changeMonth(offset) {
      currentViewDate.setMonth(currentViewDate.getMonth() + offset);
      
      const grid = document.getElementById('calendarGrid');
      grid.classList.remove('grid-animate');
      void grid.offsetWidth;
      grid.classList.add('grid-animate');
      
      renderCalendar();
  }

  function goToToday() {
      currentViewDate = new Date();
      
      const grid = document.getElementById('calendarGrid');
      grid.classList.remove('grid-animate');
      void grid.offsetWidth;
      grid.classList.add('grid-animate');

      renderCalendar();
  }

  function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const monthYearTitle = document.getElementById('currentMonthYear');
      
      const year = currentViewDate.getFullYear();
      const month = currentViewDate.getMonth(); // 0-11

      const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
      monthYearTitle.innerText = `${monthNames[month]} ${year}`;

      sortableZones.forEach(z => z.destroy());
      sortableZones = [];

      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1);
      let startDay = firstDay.getDay() - 1;
      if (startDay === -1) startDay = 6;

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      const today = new Date();
      const isCurrentMonth = today.getMonth() === month && today.getFullYear() === year;
      const todayDate = today.getDate();

      let html = '';
      let cellCount = 0;

      // 1. Дни предыдущего месяца
      for (let i = startDay - 1; i >= 0; i--) {
          const d = daysInPrevMonth - i;
          html += 
            (null, d, true, false, cellCount);
          cellCount++;
      }

      // 2. Дни текущего месяца
      for (let d = 1; d <= daysInMonth; d++) {
          const isToday = isCurrentMonth && d === todayDate;
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          html += createDayCell(dateStr, d, false, isToday, cellCount);
          cellCount++;
      }

      // 3. Заполняем сетку до конца
      const totalCells = cellCount <= 35 ? 35 : 42; 
      let nextMonthDay = 1;
      while (cellCount < totalCells) {
          html += createDayCell(null, nextMonthDay, true, false, cellCount);
          nextMonthDay++;
          cellCount++;
      }

      grid.className = `flex-1 grid grid-cols-7 ${totalCells === 42 ? 'grid-rows-6' : 'grid-rows-5'} bg-gray-200 dark:bg-gray-800 gap-px grid-animate`;
      grid.innerHTML = html;

      // Инициализация Drag and Drop
      document.querySelectorAll('.calendar-day-dropzone').forEach(zone => {
          sortableZones.push(new Sortable(zone, {
              group: 'calendar-tasks',
              animation: 150,
              ghostClass: 'opacity-50',
              dragClass: 'sortable-drag',
              easing: "cubic-bezier(0.25, 1, 0.5, 1)",
              onAdd: function (evt) {
                  const itemEl = evt.item;
                  const newDate = evt.to.dataset.date;
                  const taskId = itemEl.dataset.taskId;
                  const boardId = itemEl.dataset.boardId;
                  const isLocal = itemEl.dataset.isLocal === 'true';
                  
                  if (newDate) {
                      updateTaskDate(boardId, taskId, newDate, isLocal);
                  }
              }
          }));
      });

      lucide.createIcons();
  }

function createDayCell(dateStr, dayNum, isFiller, isToday = false, cellIndex = 0) {
      const dayOfWeekIndex = cellIndex % 7;
      const isWeekend = dayOfWeekIndex === 5 || dayOfWeekIndex === 6;
      const weekendBg = isWeekend && !isFiller ? "bg-rose-50/20 dark:bg-rose-900/10" : "";

      if (isFiller) {
          return `
            <div class="bg-gray-50/50 dark:bg-gray-900/30 p-1 sm:p-2 opacity-40 border-r border-b border-gray-200 dark:border-gray-800 flex flex-col items-center sm:items-start">
              <span class="text-[10px] sm:text-xs font-bold text-gray-400">${dayNum}</span>
            </div>`;
      }

      let tasksForDay = allTasks.filter(t => t.dueDate === dateStr);
      if (currentFilter !== 'all') {
          tasksForDay = tasksForDay.filter(t => t.priority === currentFilter);
      }
      
      const badgeClass = isToday 
          ? "bg-indigo-600 text-white shadow-[0_0_10px_rgba(79,70,229,0.5)] w-5 h-5 sm:w-8 sm:h-8 flex items-center justify-center rounded-md sm:rounded-xl ring-2 ring-indigo-300 dark:ring-indigo-700" 
          : `text-gray-700 dark:text-gray-300 w-5 h-5 sm:w-7 sm:h-7 flex items-center justify-center rounded-md sm:rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors ${isWeekend ? 'text-rose-500' : ''}`;

      const bgClass = isToday 
          ? "bg-indigo-50/10 dark:bg-indigo-900/20 ring-inset ring-2 ring-indigo-500/50 shadow-inner z-10" 
          : `bg-white dark:bg-gray-900 ${weekendBg}`;

      let tasksHtml = tasksForDay.map(t => {
          // ЭНТЕРПРАЙЗ: Адаптивные классы. На мобилках - тонкая полоска (h-1.5), на ПК - карточка с текстом
          let priorityClass = "bg-blue-500 sm:bg-blue-50 sm:text-blue-700 sm:border-blue-200 dark:sm:bg-blue-900/30 dark:sm:text-blue-400 dark:sm:border-blue-800/50 hover:sm:bg-blue-100";
          if (t.priority === 'high') priorityClass = "bg-amber-500 sm:bg-amber-50 sm:text-amber-700 sm:border-amber-200 dark:sm:bg-amber-900/30 dark:sm:text-amber-400 dark:sm:border-amber-800/50 hover:sm:bg-amber-100";
          if (t.priority === 'critical') priorityClass = "bg-rose-500 sm:bg-rose-50 sm:text-rose-700 sm:border-rose-200 dark:sm:bg-rose-900/30 dark:sm:text-rose-400 dark:sm:border-rose-800/50 hover:sm:bg-rose-100 shadow-sm";

          return `
            <a href="board.html?b=${t.boardId}&c=${t.id}" target="_blank" data-task-id="${t.id}" data-board-id="${t.boardId}" data-is-local="${t.isLocal}" onclick="event.stopPropagation()" class="block mb-0.5 sm:mb-1.5 sm:p-2 sm:border rounded-full sm:rounded-xl text-[10px] font-bold cursor-grab active:cursor-grabbing hover:scale-[1.02] transition-all w-full h-1 sm:h-auto ${priorityClass}" title="${t.title}">
               <div class="hidden sm:flex items-center gap-1 mb-0.5 opacity-60">
                 ${t.isLocal ? '<i data-lucide="hard-drive" class="w-3 h-3"></i>' : '<i data-lucide="cloud" class="w-3 h-3"></i>'}
                 <span class="truncate max-w-[60px] lg:max-w-[80px]">${t.boardTitle}</span>
               </div>
               <span class="hidden sm:inline truncate w-full block">${t.title}</span>
            </a>`;
      }).join('');

      return `
        <div class="flex flex-col ${bgClass} transition-colors group cursor-pointer border-r border-b border-gray-200 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/50" onclick="openDayModal('${dateStr}')">
          <div class="p-1 sm:p-2 flex justify-center sm:justify-between items-center transition-colors pointer-events-none">
            <span class="text-[11px] sm:text-sm font-black ${badgeClass}">${dayNum}</span>
            <div class="hidden sm:flex items-center gap-1">
               ${tasksForDay.length > 0 ? `<span class="text-[9px] font-black text-gray-400 bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded-md">${tasksForDay.length}</span>` : ''}
               <button onclick="event.stopPropagation(); openQuickAddModal('${dateStr}')" class="opacity-0 group-hover:opacity-100 p-1 text-gray-400 hover:text-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 rounded-lg transition-all pointer-events-auto" title="Добавить задачу">
                 <i data-lucide="plus" class="w-3.5 h-3.5"></i>
               </button>
            </div>
          </div>
          <div class="flex-1 p-0.5 sm:p-1.5 flex flex-col overflow-y-auto hide-scroll calendar-day-dropzone min-h-[30px] sm:min-h-[60px]" data-date="${dateStr}" onclick="event.stopPropagation()">
            ${tasksHtml}
          </div>
        </div>`;
  }

  // --- ДВИЖОК ОБНОВЛЕНИЯ ДАТЫ ПРИ DRAG & DROP ---
  async function updateTaskDate(boardId, taskId, newDateStr, isLocal) {
      const taskIndex = allTasks.findIndex(t => t.id === taskId);
      if (taskIndex !== -1) {
          allTasks[taskIndex].dueDate = newDateStr;
      }

      if (isLocal) {
          const localBoards = JSON.parse(localStorage.getItem('blocko_local_boards')) || {};
          const board = localBoards[boardId];
          if (board) {
              board.columns.forEach(col => {
                  if (col.cards) {
                      const cIdx = col.cards.findIndex(c => c.id === taskId);
                      if (cIdx !== -1) col.cards[cIdx].dueDate = newDateStr;
                  }
              });
              localStorage.setItem('blocko_local_boards', JSON.stringify(localBoards));
              showSystemToast('Дедлайн изменен', `Офлайн задача перенесена на ${newDateStr}.`, 'check-circle', 'text-emerald-500', 'bg-emerald-50 dark:bg-emerald-900/30');
          }
      } else {
          try {
              await db.collection("boards").doc(boardId).collection("cards").doc(taskId).update({
                  dueDate: newDateStr,
                  updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              });
              showSystemToast('Дедлайн изменен', `Задача перенесена на ${newDateStr}.`, 'check-circle', 'text-indigo-500', 'bg-indigo-50 dark:bg-indigo-900/30');
          } catch (e) {
              console.error(e);
              showSystemToast('Ошибка', 'Не удалось обновить дату в облаке.', 'alert-triangle', 'text-red-500', 'bg-red-50 dark:bg-red-900/30');
          }
      }
      
      renderCalendar();
  }

  // Заглушка для кнопки "Быстрое добавление"
  function showQuickAddToast(dateStr) {
      showSystemToast('Quick Add', `Добавление задачи напрямую в ${dateStr} появится в следующем обновлении.`, 'plus-circle', 'text-indigo-500', 'bg-indigo-50 dark:bg-indigo-900/30');
  }

  function showSystemToast(title, desc, iconName, iconColor, bgColor) {
      const toast = document.getElementById('globalToast');
      document.getElementById('toastTitle').innerText = title;
      document.getElementById('toastDesc').innerText = desc;
      const iconEl = document.getElementById('toastIcon');
      iconEl.setAttribute('data-lucide', iconName);
      iconEl.className = `w-5 h-5 ${iconColor}`;
      document.getElementById('toastIconBg').className = `p-2.5 rounded-full flex-shrink-0 ${bgColor}`;
      lucide.createIcons({ root: toast });

      toast.classList.remove('translate-y-24', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 4000);
  }

  // --- ЛОГИКА ДЕТАЛЬНОГО ПРОСМОТРА ДНЯ ---
  function openDayModal(dateStr) {
      const modal = document.getElementById('dayViewModal');
      const content = document.getElementById('dayViewContent');
      const container = document.getElementById('modalDayTasks');
      
      // Форматируем заголовок (например: 25 Октября 2026)
      const dateObj = new Date(dateStr);
      const options = { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' };
      document.getElementById('modalDayTitle').innerText = dateObj.toLocaleDateString('ru-RU', options);

      // Ищем задачи
      let dayTasks = allTasks.filter(t => t.dueDate === dateStr);
      if (currentFilter !== 'all') dayTasks = dayTasks.filter(t => t.priority === currentFilter);

      if (dayTasks.length === 0) {
          container.innerHTML = `
            <div class="flex flex-col items-center justify-center py-10 text-center text-gray-400">
              <div class="w-16 h-16 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mb-4"><i data-lucide="coffee" class="w-8 h-8"></i></div>
              <p class="font-bold text-sm text-gray-600 dark:text-gray-300">На этот день задач нет</p>
              <p class="text-xs mt-1">Отдыхайте или запланируйте что-то новое.</p>
            </div>`;
      } else {
          container.innerHTML = dayTasks.map(t => {
              let pColor = "text-blue-500 bg-blue-50 dark:bg-blue-900/30";
              let pIcon = "arrow-right";
              if (t.priority === 'high') { pColor = "text-amber-500 bg-amber-50 dark:bg-amber-900/30"; pIcon = "arrow-up-from-line"; }
              if (t.priority === 'critical') { pColor = "text-rose-500 bg-rose-50 dark:bg-rose-900/30"; pIcon = "zap"; }

              return `
              <a href="board.html?b=${t.boardId}&c=${t.id}" target="_blank" class="flex flex-col bg-white dark:bg-gray-900 p-4 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-sm hover:shadow-md transition-all active:scale-[0.98] group">
                <div class="flex justify-between items-start mb-2">
                  <span class="text-[10px] font-bold text-gray-500 flex items-center gap-1.5"><i data-lucide="${t.isLocal ? 'hard-drive' : 'layout'}" class="w-3.5 h-3.5"></i> ${t.boardTitle}</span>
                  <div class="px-2 py-1 rounded-md flex items-center gap-1 text-[9px] font-black uppercase tracking-widest ${pColor}"><i data-lucide="${pIcon}" class="w-3 h-3"></i> ${t.priority}</div>
                </div>
                <h4 class="font-bold text-gray-900 dark:text-white text-base leading-tight group-hover:text-indigo-500 transition-colors">${t.title}</h4>
              </a>`;
          }).join('');
      }

      lucide.createIcons({ root: container });

      // Анимация появления
      modal.classList.remove('hidden');
      setTimeout(() => {
          modal.classList.remove('opacity-0');
          if (window.innerWidth < 640) {
              content.classList.remove('translate-y-full'); // Выезд снизу на мобилках
          } else {
              content.classList.remove('scale-95'); // Увеличение на ПК
          }
      }, 10);
  }

  function closeDayModal() {
      const modal = document.getElementById('dayViewModal');
      const content = document.getElementById('dayViewContent');
      
      modal.classList.add('opacity-0');
      if (window.innerWidth < 640) {
          content.classList.add('translate-y-full');
      } else {
          content.classList.add('scale-95');
      }
      
      setTimeout(() => modal.classList.add('hidden'), 300);
  }

  // Закрытие модалки при клике на черный фон
  window.addEventListener('click', (e) => {
      if (e.target.id === 'dayViewModal') closeDayModal();
  });
  
  // --- ЛОГИКА БЫСТРОГО ДОБАВЛЕНИЯ ЗАДАЧИ (Quick Add) ---
  let quickAddTargetDate = null;
  let availableBoardsData = {}; // Кэш досок и их колонок
  
  async function fetchAvailableBoards() {
      availableBoardsData = {};
      const boardSelect = document.getElementById('quickAddBoard');
      boardSelect.innerHTML = '<option value="">Загрузка...</option>';
      boardSelect.disabled = true;
      
      // 1. Собираем Офлайн доски
      const localBoards = JSON.parse(localStorage.getItem('blocko_local_boards')) || {};
      Object.values(localBoards).forEach(b => {
          availableBoardsData[b.id] = { id: b.id, title: b.title, isLocal: true, columns: b.columns || [] };
      });
      
      // 2. Собираем Облачные доски
      if (navigator.onLine && currentUser) {
          try {
              const snap = await db.collection("boards").where("members", "array-contains", currentUser.uid).get();
              snap.forEach(doc => {
                  const data = doc.data();
                  availableBoardsData[doc.id] = { id: doc.id, title: data.title, isLocal: false, columns: data.columns || [] };
              });
          } catch(e) { console.error("Ошибка загрузки досок", e); }
      }
      
      // Рендерим селект проектов
      boardSelect.innerHTML = '<option value="">Выберите проект...</option>';
      Object.values(availableBoardsData).forEach(b => {
          boardSelect.innerHTML += `<option value="${b.id}">${b.isLocal ? '💽 ' : '☁️ '}${b.title}</option>`;
      });
      boardSelect.disabled = false;
  }

  function updateQuickAddColumns() {
      const boardId = document.getElementById('quickAddBoard').value;
      const colSelect = document.getElementById('quickAddColumn');
      
      if (!boardId || !availableBoardsData[boardId]) {
          colSelect.innerHTML = '<option value="">Колонка...</option>';
          colSelect.disabled = true;
          return;
      }
      
      const cols = availableBoardsData[boardId].columns;
      if (cols.length === 0) {
          colSelect.innerHTML = '<option value="">Нет колонок</option>';
          colSelect.disabled = true;
      } else {
          colSelect.innerHTML = cols.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
          colSelect.disabled = false;
      }
  }
  
  function openQuickAddModal(dateStr) {
      quickAddTargetDate = dateStr;
      
      // Красивая дата в шапке
      const dateObj = new Date(dateStr);
      document.getElementById('quickAddDateText').innerText = 'План на ' + dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
      
      // Сброс полей
      document.getElementById('quickAddTitle').value = '';
      document.getElementById('quickAddDesc').value = '';
      document.getElementById('quickAddColumn').innerHTML = '<option value="">Колонка...</option>';
      document.getElementById('quickAddColumn').disabled = true;
      
      // Подгружаем проекты в фоне
      fetchAvailableBoards();
      
      // Анимация открытия
      const modal = document.getElementById('quickAddModal');
      const content = document.getElementById('quickAddContent');
      modal.classList.remove('hidden');
      setTimeout(() => {
          modal.classList.remove('opacity-0');
          if (window.innerWidth < 640) content.classList.remove('translate-y-full');
          else content.classList.remove('scale-95');
          
          document.getElementById('quickAddTitle').focus();
      }, 10);
  }
  
  function closeQuickAddModal() {
      const modal = document.getElementById('quickAddModal');
      const content = document.getElementById('quickAddContent');
      
      modal.classList.add('opacity-0');
      if (window.innerWidth < 640) content.classList.add('translate-y-full');
      else content.classList.add('scale-95');
      
      setTimeout(() => modal.classList.add('hidden'), 300);
  }

  async function confirmQuickAddTask() {
      const title = document.getElementById('quickAddTitle').value.trim();
      const desc = document.getElementById('quickAddDesc').value.trim();
      const boardId = document.getElementById('quickAddBoard').value;
      const colId = document.getElementById('quickAddColumn').value;
      
      if (!title) return showSystemToast('Внимание', 'Введите что нужно сделать.', 'alert-circle', 'text-amber-500', 'bg-amber-50 dark:bg-amber-900/30');
      if (!boardId || !colId) return showSystemToast('Внимание', 'Выберите проект и колонку для сохранения.', 'alert-circle', 'text-amber-500', 'bg-amber-50 dark:bg-amber-900/30');
      
      const btn = document.getElementById('btnQuickSave');
      const ogHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Секунду...';
      lucide.createIcons({ root: btn.parentElement });

      const board = availableBoardsData[boardId];
      const cardId = 'card_' + Date.now();
      
      // Формируем чистую базовую карточку
      const newCard = {
          id: cardId,
          title: title,
          description: desc,
          dueDate: quickAddTargetDate,
          columnId: colId,
          author: { id: currentUser.uid, name: currentUser.displayName },
          archived: false,
          type: 'task',
          priority: 'normal',
          tags: [],
          comments: [],
          checklist: [],
          order: 99999, // Закидываем в самый низ колонки
          createdAt: new Date().toISOString()
      };
      
      try {
          if (board.isLocal) {
              const localBoards = JSON.parse(localStorage.getItem('blocko_local_boards')) || {};
              const localBoard = localBoards[boardId];
              if (localBoard) {
                  const col = localBoard.columns.find(c => c.id == colId);
                  if (col) {
                      if(!col.cards) col.cards = [];
                      col.cards.push(newCard);
                      localStorage.setItem('blocko_local_boards', JSON.stringify(localBoards));
                  }
              }
          } else {
              await db.collection("boards").doc(boardId).collection("cards").doc(cardId).set({
                  ...newCard,
                  updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              });
          }
          
          // Мгновенно добавляем в локальный массив календаря для рендера
          allTasks.push({
              ...newCard,
              boardId: boardId,
              boardTitle: board.title,
              colId: colId,
              isLocal: board.isLocal
          });
          
          renderCalendar();
          closeQuickAddModal();
          showSystemToast('Успех', 'Задача залетела на доску!', 'check-circle', 'text-emerald-500', 'bg-emerald-50 dark:bg-emerald-900/30');
          
      } catch(e) {
          console.error(e);
          showSystemToast('Ошибка', 'Не удалось сохранить задачу.', 'alert-triangle', 'text-red-500', 'bg-red-50');
      } finally {
          btn.disabled = false;
          btn.innerHTML = ogHtml;
          lucide.createIcons({ root: btn.parentElement });
      }
  }

  // Обновляем слушатель кликов, чтобы он закрывал и модалку быстрого добавления
  window.addEventListener('click', (e) => {
      if (e.target.id === 'dayViewModal') closeDayModal();
      if (e.target.id === 'quickAddModal') closeQuickAddModal();
  });
</script>
</body>
