<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Календарь — Blocko Pro</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="ui.css">
  <script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="security.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="config.js"></script>

  <style>
    body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    html, body { width: 100%; min-height: 100dvh; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .cal-chip.sortable-ghost { opacity: .35; }
    .cal-chip.sortable-drag { box-shadow: 0 12px 24px -8px rgb(0 0 0 / .25); transform: rotate(1deg); }
    .cal-day.drop-hover { outline: 2px dashed rgba(59,130,246,.6); outline-offset: -3px; }
    @keyframes calIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .cal-in { animation: calIn .22s ease; }
    @media (prefers-reduced-motion: reduce) { .cal-in { animation: none; } }
    /* На ПК календарь занимает экран целиком, ячейки делят высоту поровну */
    @media (min-width: 1024px) {
      .cal-shell { height: calc(100dvh - 4rem); }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 flex flex-col">

<div id="globalLoader" class="fixed inset-0 z-[200] flex items-center justify-center bg-gray-50 dark:bg-gray-950 transition-opacity duration-500">
  <div class="flex flex-col items-center gap-4 text-gray-400">
    <span class="bg-blue-600 p-3 rounded-2xl text-white"><i data-lucide="calendar-days" class="w-7 h-7"></i></span>
    <span class="text-sm">Собираем сроки со всех проектов…</span>
  </div>
</div>

<!-- Шапка — как на главной -->
<header class="px-4 sm:px-6 lg:px-8 h-16 border-b border-gray-200/80 dark:border-gray-800 bg-white/80 dark:bg-gray-950/80 backdrop-blur-xl flex items-center gap-3 sticky top-0 z-30">
  <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-xl text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white transition-colors" title="На главную" aria-label="На главную"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
  <div class="min-w-0">
    <h1 class="text-base sm:text-lg font-semibold tracking-tight leading-tight">Календарь</h1>
    <p class="hidden sm:block text-xs text-gray-500 dark:text-gray-400 leading-tight">Сроки задач из всех проектов</p>
  </div>
  <div class="ml-auto flex items-center gap-1.5">
    <button onclick="fetchCalendarTasks(true)" id="syncBtn" class="w-10 h-10 flex items-center justify-center rounded-xl text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white transition-colors" title="Обновить" aria-label="Обновить"><i data-lucide="refresh-cw" class="w-[18px] h-[18px]"></i></button>
    <button onclick="exportToICal()" class="w-10 h-10 flex items-center justify-center rounded-xl text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white transition-colors" title="Скачать в Google / Apple Календарь (.ics)" aria-label="Экспорт в календарь"><i data-lucide="calendar-plus" class="w-[18px] h-[18px]"></i></button>
    <button onclick="toggleTheme()" aria-label="Сменить тему" class="w-10 h-10 flex items-center justify-center rounded-xl text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
      <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i><i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
    </button>
  </div>
</header>

<div class="cal-shell w-full max-w-[1500px] mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-5 flex flex-col lg:flex-row gap-4 lg:gap-6 lg:min-h-0">

  <!-- Календарь -->
  <section class="flex-1 min-w-0 flex flex-col lg:min-h-0">
    <!-- Панель управления -->
    <div class="flex flex-wrap items-center gap-2 mb-3 sm:mb-4">
      <div class="flex items-center gap-1">
        <button onclick="shiftPeriod(-1)" class="w-9 h-9 flex items-center justify-center rounded-lg text-gray-500 hover:bg-white dark:hover:bg-gray-900 hover:text-gray-900 dark:hover:text-white border border-transparent hover:border-gray-200 dark:hover:border-gray-800 transition-colors" title="Назад" aria-label="Назад"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
        <button onclick="shiftPeriod(1)" class="w-9 h-9 flex items-center justify-center rounded-lg text-gray-500 hover:bg-white dark:hover:bg-gray-900 hover:text-gray-900 dark:hover:text-white border border-transparent hover:border-gray-200 dark:hover:border-gray-800 transition-colors" title="Вперёд" aria-label="Вперёд"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
      </div>
      <h2 id="periodTitle" class="text-lg sm:text-xl font-semibold tracking-tight min-w-[150px] first-letter:uppercase">&nbsp;</h2>
      <button onclick="goToToday()" class="h-8 px-3 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 text-xs font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">Сегодня</button>

      <div class="w-full sm:w-auto sm:ml-auto flex items-center gap-2 order-last sm:order-none">
        <div class="flex p-0.5 rounded-lg bg-gray-100 dark:bg-gray-900 border border-gray-200/60 dark:border-gray-800" role="tablist" aria-label="Вид">
          <button data-view="month" onclick="setView('month')" class="view-btn h-8 px-3 rounded-md text-xs font-medium transition-colors">Месяц</button>
          <button data-view="week" onclick="setView('week')" class="view-btn h-8 px-3 rounded-md text-xs font-medium transition-colors">Неделя</button>
          <button data-view="list" onclick="setView('list')" class="view-btn h-8 px-3 rounded-md text-xs font-medium transition-colors">Список</button>
        </div>
        <label class="relative flex-1 sm:flex-none">
          <span class="sr-only">Проект</span>
          <select id="projectFilter" onchange="setBoardFilter(this.value)" class="w-full sm:w-48 h-9 pl-3 pr-8 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 text-sm text-gray-700 dark:text-gray-200 outline-none appearance-none cursor-pointer truncate">
            <option value="all">Все проекты</option>
          </select>
          <i data-lucide="chevrons-up-down" class="w-4 h-4 text-gray-400 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        </label>
      </div>
    </div>

    <div id="calendarViewport" class="flex-1 lg:min-h-0 flex flex-col"></div>
    <p id="dragHint" class="hidden lg:block mt-2 text-[11px] text-gray-400">Перетащите задачу на другой день, чтобы перенести срок · двойной клик по дню — новая задача</p>
  </section>

  <!-- Панель дня -->
  <aside id="dayPanel" class="w-full lg:w-[340px] flex-shrink-0 flex flex-col lg:min-h-0 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl overflow-hidden" aria-live="polite">
    <div class="px-4 pt-4 pb-3 border-b border-gray-100 dark:border-gray-800">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <div id="dayPanelTitle" class="text-base font-semibold first-letter:uppercase">&nbsp;</div>
          <div id="dayPanelSub" class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">&nbsp;</div>
        </div>
        <span id="dayPanelBadge" class="hidden text-[11px] font-medium px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-300">Сегодня</span>
      </div>
      <!-- Быстрое добавление -->
      <form id="quickAddForm" class="mt-3 space-y-2" onsubmit="event.preventDefault(); confirmQuickAddTask();">
        <div class="flex items-center h-10 px-3 rounded-xl bg-gray-100 dark:bg-gray-800 border border-transparent focus-within:border-blue-500 focus-within:bg-white dark:focus-within:bg-gray-900 transition-colors">
          <i data-lucide="plus" class="w-4 h-4 text-gray-400 mr-2 flex-shrink-0"></i>
          <input id="quickAddTitle" type="text" maxlength="200" placeholder="Новая задача на этот день" autocomplete="off" class="bg-transparent outline-none text-sm w-full text-gray-900 dark:text-white placeholder-gray-400" />
        </div>
        <div id="quickAddMore" class="hidden grid grid-cols-2 gap-2">
          <select id="quickAddBoard" onchange="updateQuickAddColumns()" class="h-9 px-2.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-xs text-gray-700 dark:text-gray-200 outline-none truncate"><option value="">Проект</option></select>
          <select id="quickAddColumn" class="h-9 px-2.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-xs text-gray-700 dark:text-gray-200 outline-none truncate disabled:opacity-50"><option value="">Колонка</option></select>
          <button type="submit" id="btnQuickSave" class="col-span-2 h-9 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium transition-colors">Добавить</button>
        </div>
      </form>
    </div>
    <div id="dayPanelList" class="flex-1 lg:min-h-0 overflow-y-auto p-2"></div>
  </aside>
</div>

<div id="globalToast" class="fixed bottom-5 right-5 left-5 sm:left-auto z-[800] translate-y-24 opacity-0 transition-all duration-300 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-3.5 rounded-xl shadow-xl flex items-start gap-3 sm:max-w-sm pointer-events-none">
  <div id="toastIconBg" class="p-2 rounded-lg flex-shrink-0 bg-blue-50 dark:bg-blue-900/30"><i id="toastIcon" data-lucide="info" class="w-4 h-4 text-blue-500"></i></div>
  <div class="min-w-0"><h4 id="toastTitle" class="text-sm font-semibold text-gray-900 dark:text-white">Уведомление</h4><p id="toastDesc" class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 leading-relaxed"></p></div>
</div>

<script>
  if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
  function toggleTheme() {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
  }
  lucide.createIcons();

  // ---------------- состояние ----------------
  let currentUser = null;
  let allTasks = [];               // задачи со сроком
  let boardsMeta = {};             // id → { id, title, isLocal, columns, color }
  let viewDate = new Date();       // опорная дата периода
  let selectedDate = ymd(new Date());
  let filterBoardId = localStorage.getItem('blocko_calendar_filter') || 'all';
  let currentView = localStorage.getItem('blocko_calendar_view') || (window.innerWidth < 640 ? 'list' : 'month');
  if (!['month', 'week', 'list'].includes(currentView)) currentView = 'month';
  let sortables = [];

  const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  const DOW = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  const PALETTE = ['#3b82f6', '#22c55e', '#f59e0b', '#ef4444', '#8b5cf6', '#14b8a6', '#ec4899', '#64748b'];
  const DONE_COL = /готов|done|выполн|закрыт|complete/i;

  function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
  function parseYmd(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
  const todayStr = () => ymd(new Date());
  const dateKey = (due) => String(due || '').slice(0, 10);

  function showSystemToast(title, desc, iconName, iconColor, bgColor) {
    const toast = document.getElementById('globalToast');
    document.getElementById('toastTitle').innerText = title;
    document.getElementById('toastDesc').innerText = desc;
    const iconEl = document.getElementById('toastIcon');
    iconEl.setAttribute('data-lucide', iconName);
    iconEl.setAttribute('class', `w-4 h-4 ${iconColor}`);
    document.getElementById('toastIconBg').className = `p-2 rounded-lg flex-shrink-0 ${bgColor}`;
    lucide.createIcons({ root: toast });
    toast.classList.remove('translate-y-24', 'opacity-0');
    clearTimeout(showSystemToast.t);
    showSystemToast.t = setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 3500);
  }

  // ---------------- загрузка ----------------
  auth.onAuthStateChanged(async (user) => {
    const loader = document.getElementById('globalLoader');
    if (!user) { window.location.href = 'index.html'; return; }
    currentUser = user;
    await fetchCalendarTasks(false);
    loader.style.opacity = '0';
    setTimeout(() => loader.classList.add('hidden'), 500);
  });

  async function fetchCalendarTasks(manual) {
    if (!currentUser) return;
    const btn = document.getElementById('syncBtn');
    btn.classList.add('animate-spin');
    const tasks = [];
    const meta = {};
    let colorIdx = 0;
    const addBoard = (id, title, isLocal, columns) => { meta[id] = { id, title: title || 'Без названия', isLocal, columns: columns || [], color: PALETTE[colorIdx++ % PALETTE.length] }; };
    const pushTask = (card, boardId, colId) => {
      if (!card || card.archived || !card.dueDate || !/^\d{4}-\d{2}-\d{2}/.test(String(card.dueDate))) return;
      const b = meta[boardId];
      const col = (b.columns || []).find((c) => String(c.id) === String(colId));
      tasks.push({ ...card, id: String(card.id), boardId, colId, colName: col ? col.name : '', done: !!(col && DONE_COL.test(col.name || '')), isLocal: b.isLocal, date: dateKey(card.dueDate), priority: card.priority || 'normal' });
    };

    const localBoards = (() => { try { return JSON.parse(localStorage.getItem('blocko_local_boards')) || {}; } catch (e) { return {}; } })();
    Object.values(localBoards).forEach((b) => {
      if (!b || !b.id) return;
      addBoard(b.id, b.title, true, (b.columns || []).map((c) => ({ id: c.id, name: c.name })));
      (b.columns || []).forEach((col) => (col.cards || []).forEach((card) => pushTask(card, b.id, col.id)));
    });

    if (navigator.onLine) {
      try {
        const snap = await db.collection('boards').where('members', 'array-contains', currentUser.uid).get();
        await Promise.all(snap.docs.map(async (bDoc) => {
          const data = bDoc.data();
          addBoard(bDoc.id, data.title, false, data.columns || []);
          try {
            const cards = await db.collection('boards').doc(bDoc.id).collection('cards').where('archived', '==', false).get();
            cards.forEach((c) => { const card = { id: c.id, ...c.data() }; pushTask(card, bDoc.id, card.columnId); });
          } catch (e) { /* доска с паролем без недавнего ввода — пропускаем */ }
        }));
      } catch (e) {
        console.error('calendar fetch', e);
        showSystemToast('Не всё загрузилось', 'Часть облачных задач не получена. Проверьте интернет.', 'alert-triangle', 'text-amber-500', 'bg-amber-50 dark:bg-amber-900/30');
      }
    }

    allTasks = tasks;
    boardsMeta = meta;
    if (filterBoardId !== 'all' && !boardsMeta[filterBoardId]) filterBoardId = 'all';
    populateFilters();
    render();
    btn.classList.remove('animate-spin');
    if (manual) showSystemToast('Обновлено', `Задач со сроком: ${allTasks.length}.`, 'check-circle', 'text-green-500', 'bg-green-50 dark:bg-green-900/30');
  }

  function populateFilters() {
    const sel = document.getElementById('projectFilter');
    const boards = Object.values(boardsMeta).sort((a, b) => a.title.localeCompare(b.title, 'ru'));
    sel.innerHTML = '<option value="all">Все проекты</option>' + boards.map((b) => `<option value="${esc(b.id)}" ${b.id === filterBoardId ? 'selected' : ''}>${esc(b.title)}${b.isLocal ? ' (локальный)' : ''}</option>`).join('');
    const qb = document.getElementById('quickAddBoard');
    qb.innerHTML = '<option value="">Проект</option>' + boards.map((b) => `<option value="${esc(b.id)}">${esc(b.title)}</option>`).join('');
    if (filterBoardId !== 'all') { qb.value = filterBoardId; updateQuickAddColumns(); }
  }

  function visibleTasks() { return filterBoardId === 'all' ? allTasks : allTasks.filter((t) => t.boardId === filterBoardId); }
  function tasksOn(dateStr) {
    const prio = { critical: 0, high: 1, normal: 2, low: 3 };
    return visibleTasks().filter((t) => t.date === dateStr).sort((a, b) => (a.done - b.done) || ((prio[a.priority] ?? 2) - (prio[b.priority] ?? 2)) || String(a.title).localeCompare(String(b.title), 'ru'));
  }
  const isOverdue = (t) => !t.done && t.date < todayStr();

  // ---------------- управление ----------------
  function setView(v) {
    currentView = v;
    localStorage.setItem('blocko_calendar_view', v);
    render();
  }
  function setBoardFilter(id) {
    filterBoardId = id;
    localStorage.setItem('blocko_calendar_filter', id);
    if (id !== 'all') { document.getElementById('quickAddBoard').value = id; updateQuickAddColumns(); }
    render();
  }
  function shiftPeriod(dir) {
    if (currentView === 'month') viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + dir, 1);
    else if (currentView === 'week') viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate() + dir * 7);
    else viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate() + dir * 14);
    render();
  }
  function goToToday() { viewDate = new Date(); selectDay(todayStr(), false); render(); }
  function selectDay(dateStr, rerender = true) {
    selectedDate = dateStr;
    if (rerender) render();
  }

  // ---------------- отрисовка ----------------
  function render() {
    document.querySelectorAll('.view-btn').forEach((b) => {
      const on = b.dataset.view === currentView;
      b.className = `view-btn h-8 px-3 rounded-md text-xs font-medium transition-colors ${on ? 'bg-white dark:bg-gray-800 text-gray-900 dark:text-white shadow-sm' : 'text-gray-500 hover:text-gray-900 dark:hover:text-white'}`;
      b.setAttribute('aria-selected', String(on));
    });
    sortables.forEach((s) => s.destroy());
    sortables = [];
    const vp = document.getElementById('calendarViewport');
    if (currentView === 'month') renderMonth(vp);
    else if (currentView === 'week') renderWeek(vp);
    else renderList(vp);
    document.getElementById('dragHint').classList.toggle('lg:block', currentView !== 'list');
    renderDayPanel();
    lucide.createIcons({ root: vp });
    initDrag();
  }

  function chipHtml(t, compact) {
    const b = boardsMeta[t.boardId] || {};
    const prio = t.priority === 'critical' ? '<i data-lucide="flame" class="w-3 h-3 text-red-500 flex-shrink-0"></i>' : t.priority === 'high' ? '<i data-lucide="arrow-up" class="w-3 h-3 text-amber-500 flex-shrink-0"></i>' : '';
    const tone = t.done ? 'text-gray-400 line-through' : isOverdue(t) ? 'text-red-600 dark:text-red-400' : 'text-gray-700 dark:text-gray-200';
    return `<a href="board.html?b=${encodeURIComponent(t.boardId)}&c=${encodeURIComponent(t.id)}" data-task-id="${esc(t.id)}" data-board-id="${esc(t.boardId)}" data-local="${t.isLocal}" draggable="false" onclick="event.stopPropagation()"
      class="cal-chip flex items-center gap-1.5 ${compact ? 'h-6 px-1.5 text-[11.5px]' : 'h-7 px-2 text-[12.5px]'} rounded-md bg-gray-50 dark:bg-gray-800/70 hover:bg-gray-100 dark:hover:bg-gray-800 ${tone} cursor-pointer select-none" title="${esc(t.title)} · ${esc(b.title || '')}${t.colName ? ' / ' + esc(t.colName) : ''}">
      <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" style="background:${b.color || '#94a3b8'}"></span>
      <span class="truncate flex-1 min-w-0">${esc(t.title || 'Без названия')}</span>${prio}
    </a>`;
  }

  function renderMonth(vp) {
    const y = viewDate.getFullYear(), m = viewDate.getMonth();
    document.getElementById('periodTitle').textContent = `${MONTHS[m]} ${y}`;
    const first = new Date(y, m, 1);
    const offset = (first.getDay() + 6) % 7;
    const start = new Date(y, m, 1 - offset);
    const weeks = Math.ceil((offset + new Date(y, m + 1, 0).getDate()) / 7);
    const today = todayStr();
    const mobile = window.innerWidth < 640;
    let cells = '';
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const ds = ymd(d);
      const inMonth = d.getMonth() === m;
      const list = tasksOn(ds);
      const isToday = ds === today, isSel = ds === selectedDate, weekend = i % 7 >= 5;
      const max = mobile ? 0 : 3;
      const chips = list.slice(0, max).map((t) => chipHtml(t, true)).join('');
      const more = list.length > max && max > 0 ? `<button type="button" class="text-[11px] text-gray-500 hover:text-gray-900 dark:hover:text-white px-1.5 text-left" onclick="event.stopPropagation(); selectDay('${ds}')">ещё ${list.length - max}</button>` : '';
      const dots = mobile && list.length ? `<div class="flex justify-center gap-0.5 mt-1">${list.slice(0, 3).map((t) => `<span class="w-1 h-1 rounded-full" style="background:${isOverdue(t) ? '#ef4444' : (boardsMeta[t.boardId] || {}).color || '#94a3b8'}"></span>`).join('')}</div>` : '';
      cells += `<div role="gridcell" tabindex="0" data-date="${ds}" onclick="selectDay('${ds}')" ondblclick="selectDay('${ds}'); focusQuickAdd()" onkeydown="if(event.key==='Enter') selectDay('${ds}')"
        class="cal-day group relative flex flex-col min-h-0 ${mobile ? 'h-14 items-center pt-1.5' : 'p-1.5'} ${inMonth ? 'bg-white dark:bg-gray-900' : 'bg-gray-50/70 dark:bg-gray-950/60'} ${isSel ? 'ring-2 ring-inset ring-blue-500 z-[1]' : ''} cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800/40 transition-colors outline-none">
        <div class="flex items-center ${mobile ? 'justify-center' : 'justify-between'} mb-1 flex-shrink-0">
          <span class="w-6 h-6 flex items-center justify-center rounded-full text-xs font-medium ${isToday ? 'bg-blue-600 text-white' : inMonth ? (weekend ? 'text-gray-400' : 'text-gray-700 dark:text-gray-200') : 'text-gray-300 dark:text-gray-600'}">${d.getDate()}</span>
          ${!mobile && list.length > 0 ? `<span class="text-[10px] text-gray-400 tabular-nums pr-0.5">${list.length}</span>` : ''}
        </div>
        ${mobile ? dots : `<div class="cal-drop flex-1 min-h-[20px] flex flex-col gap-0.5 overflow-hidden" data-date="${ds}">${chips}${more}</div>`}
      </div>`;
    }
    vp.innerHTML = `<div class="cal-in flex-1 lg:min-h-0 flex flex-col bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl overflow-hidden">
      <div class="grid grid-cols-7 border-b border-gray-200 dark:border-gray-800 flex-shrink-0">${DOW.map((d, i) => `<div class="py-2 text-center text-[11px] font-medium ${i >= 5 ? 'text-gray-400' : 'text-gray-500 dark:text-gray-400'}">${d}</div>`).join('')}</div>
      <div role="grid" class="flex-1 grid grid-cols-7 gap-px bg-gray-200 dark:bg-gray-800" style="grid-template-rows: repeat(${weeks}, minmax(${mobile ? '56px' : '96px'}, 1fr));">${cells}</div>
    </div>`;
  }

  function renderWeek(vp) {
    const base = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate());
    const start = new Date(base.getFullYear(), base.getMonth(), base.getDate() - ((base.getDay() + 6) % 7));
    const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
    const fmt = (d) => d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    document.getElementById('periodTitle').textContent = `${fmt(start)} — ${fmt(end)}`;
    const today = todayStr();
    let cols = '';
    for (let i = 0; i < 7; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const ds = ymd(d);
      const list = tasksOn(ds);
      const isToday = ds === today, isSel = ds === selectedDate;
      cols += `<div data-date="${ds}" onclick="selectDay('${ds}')" ondblclick="selectDay('${ds}'); focusQuickAdd()" class="cal-day flex flex-col min-h-[140px] lg:min-h-0 bg-white dark:bg-gray-900 ${isSel ? 'ring-2 ring-inset ring-blue-500' : ''} cursor-pointer">
        <div class="px-2.5 py-2 flex items-center gap-2 border-b border-gray-100 dark:border-gray-800">
          <span class="text-[11px] font-medium ${i >= 5 ? 'text-gray-400' : 'text-gray-500'}">${DOW[i]}</span>
          <span class="w-6 h-6 flex items-center justify-center rounded-full text-xs font-semibold ${isToday ? 'bg-blue-600 text-white' : 'text-gray-800 dark:text-gray-100'}">${d.getDate()}</span>
          ${list.length ? `<span class="ml-auto text-[10px] text-gray-400">${list.length}</span>` : ''}
        </div>
        <div class="cal-drop flex-1 p-1.5 flex flex-col gap-1 overflow-y-auto" data-date="${ds}">${list.map((t) => chipHtml(t, false)).join('') || '<span class="m-auto text-[11px] text-gray-300 dark:text-gray-600 pointer-events-none">—</span>'}</div>
      </div>`;
    }
    vp.innerHTML = `<div class="cal-in flex-1 lg:min-h-0 grid grid-cols-1 sm:grid-cols-7 gap-px bg-gray-200 dark:bg-gray-800 border border-gray-200 dark:border-gray-800 rounded-2xl overflow-hidden">${cols}</div>`;
  }

  function renderList(vp) {
    const startD = parseYmd(ymd(viewDate));
    const to = ymd(new Date(startD.getFullYear(), startD.getMonth(), startD.getDate() + 13));
    const fmt = (d) => d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    document.getElementById('periodTitle').textContent = `${fmt(startD)} — ${fmt(parseYmd(to))}`;
    const overdue = ymd(viewDate) === todayStr() ? visibleTasks().filter(isOverdue).sort((a, b) => a.date.localeCompare(b.date)) : [];
    const inRange = visibleTasks().filter((t) => t.date >= ymd(viewDate) && t.date <= to);
    const byDate = {};
    inRange.forEach((t) => { (byDate[t.date] = byDate[t.date] || []).push(t); });
    const row = (t) => `<a href="board.html?b=${encodeURIComponent(t.boardId)}&c=${encodeURIComponent(t.id)}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800/60 transition-colors">
        <span class="w-2 h-2 rounded-full flex-shrink-0" style="background:${(boardsMeta[t.boardId] || {}).color || '#94a3b8'}"></span>
        <span class="flex-1 min-w-0"><span class="block truncate text-sm ${t.done ? 'line-through text-gray-400' : isOverdue(t) ? 'text-red-600 dark:text-red-400' : 'text-gray-900 dark:text-white'}">${esc(t.title || 'Без названия')}</span>
          <span class="block truncate text-xs text-gray-500 dark:text-gray-400">${esc((boardsMeta[t.boardId] || {}).title || '')}${t.colName ? ' · ' + esc(t.colName) : ''}</span></span>
        ${t.priority === 'critical' ? '<i data-lucide="flame" class="w-4 h-4 text-red-500"></i>' : t.priority === 'high' ? '<i data-lucide="arrow-up" class="w-4 h-4 text-amber-500"></i>' : ''}
      </a>`;
    let html = '';
    if (overdue.length) html += `<div class="mb-2"><div class="px-3 pt-1 pb-1.5 text-xs font-semibold text-red-600 dark:text-red-400">Просрочено · ${overdue.length}</div>${overdue.map(row).join('')}</div>`;
    const dates = Object.keys(byDate).sort();
    dates.forEach((ds) => {
      const d = parseYmd(ds);
      const label = ds === todayStr() ? 'Сегодня' : ds === ymd(new Date(Date.now() + 864e5)) ? 'Завтра' : d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
      html += `<div class="mb-2"><button type="button" onclick="selectDay('${ds}')" class="w-full text-left px-3 pt-2 pb-1.5 text-xs font-semibold text-gray-500 dark:text-gray-400 first-letter:uppercase hover:text-gray-900 dark:hover:text-white">${label} · ${byDate[ds].length}</button>${byDate[ds].sort((a, b) => a.done - b.done).map(row).join('')}</div>`;
    });
    if (!html) html = `<div class="py-16 text-center text-gray-400"><div class="w-12 h-12 mx-auto mb-3 rounded-2xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center"><i data-lucide="calendar-check" class="w-6 h-6"></i></div><p class="text-sm font-medium text-gray-600 dark:text-gray-300">На ближайшие 2 недели сроков нет</p><p class="text-xs mt-1">Добавьте задачу справа или в проекте.</p></div>`;
    vp.innerHTML = `<div class="cal-in flex-1 lg:min-h-0 overflow-y-auto bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-2">${html}</div>`;
  }

  function renderDayPanel() {
    const d = parseYmd(selectedDate);
    const list = tasksOn(selectedDate);
    document.getElementById('dayPanelTitle').textContent = d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
    const open = list.filter((t) => !t.done).length;
    document.getElementById('dayPanelSub').textContent = list.length ? `Задач: ${list.length}${open !== list.length ? ` · открытых ${open}` : ''}` : 'Задач нет';
    document.getElementById('dayPanelBadge').classList.toggle('hidden', selectedDate !== todayStr());
    const box = document.getElementById('dayPanelList');
    if (!list.length) {
      box.innerHTML = `<div class="py-10 text-center text-gray-400 text-xs px-6">На этот день ничего не запланировано.<br>Впишите задачу в поле выше.</div>`;
      return;
    }
    box.innerHTML = list.map((t) => {
      const b = boardsMeta[t.boardId] || {};
      const prio = { critical: ['Критично', 'text-red-600 bg-red-50 dark:bg-red-900/20 dark:text-red-400'], high: ['Высокий', 'text-amber-600 bg-amber-50 dark:bg-amber-900/20 dark:text-amber-400'] }[t.priority];
      return `<a href="board.html?b=${encodeURIComponent(t.boardId)}&c=${encodeURIComponent(t.id)}" class="flex items-start gap-3 px-3 py-2.5 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800/60 transition-colors">
        <span class="w-2 h-2 rounded-full mt-1.5 flex-shrink-0" style="background:${b.color || '#94a3b8'}"></span>
        <span class="flex-1 min-w-0">
          <span class="block text-sm leading-snug ${t.done ? 'line-through text-gray-400' : isOverdue(t) ? 'text-red-600 dark:text-red-400' : 'text-gray-900 dark:text-white'}">${esc(t.title || 'Без названия')}</span>
          <span class="flex items-center gap-1.5 mt-0.5 text-xs text-gray-500 dark:text-gray-400 min-w-0"><span class="truncate">${esc(b.title || '')}${t.colName ? ' · ' + esc(t.colName) : ''}</span>${prio ? `<span class="flex-shrink-0 text-[10px] font-medium px-1.5 py-px rounded ${prio[1]}">${prio[0]}</span>` : ''}</span>
        </span>
        <i data-lucide="arrow-up-right" class="w-4 h-4 text-gray-300 dark:text-gray-600 mt-0.5 flex-shrink-0"></i>
      </a>`;
    }).join('');
    lucide.createIcons({ root: box });
  }

  // ---------------- перенос срока перетаскиванием ----------------
  function initDrag() {
    if (window.innerWidth < 640) return; // на телефоне перенос — через карточку задачи
    document.querySelectorAll('.cal-drop').forEach((zone) => {
      sortables.push(new Sortable(zone, {
        group: 'calendar-tasks', draggable: '.cal-chip', animation: 150, ghostClass: 'sortable-ghost', dragClass: 'sortable-drag',
        forceFallback: true, fallbackOnBody: true, fallbackTolerance: 4,
        onMove: (evt) => { document.querySelectorAll('.drop-hover').forEach((el) => el.classList.remove('drop-hover')); evt.to.closest('.cal-day')?.classList.add('drop-hover'); },
        onEnd: (evt) => {
          document.querySelectorAll('.drop-hover').forEach((el) => el.classList.remove('drop-hover'));
          const to = evt.to.dataset.date, from = evt.from.dataset.date;
          if (to && to !== from) updateTaskDate(evt.item.dataset.boardId, evt.item.dataset.taskId, to, evt.item.dataset.local === 'true');
          else render();
        },
      }));
    });
  }

  async function updateTaskDate(boardId, taskId, newDate, isLocal) {
    const t = allTasks.find((x) => x.id === taskId && x.boardId === boardId);
    const old = t ? t.date : null;
    const oldDue = t ? t.dueDate : null;
    if (t) { t.date = newDate; t.dueDate = newDate; }
    selectedDate = newDate;
    render();
    const label = parseYmd(newDate).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    try {
      if (isLocal) {
        const boards = JSON.parse(localStorage.getItem('blocko_local_boards')) || {};
        (boards[boardId]?.columns || []).forEach((col) => (col.cards || []).forEach((c) => { if (String(c.id) === taskId) c.dueDate = newDate; }));
        localStorage.setItem('blocko_local_boards', JSON.stringify(boards));
      } else {
        await db.collection('boards').doc(boardId).collection('cards').doc(taskId).update({ dueDate: newDate, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      }
      showSystemToast('Срок перенесён', `«${t ? t.title : 'Задача'}» — на ${label}.`, 'check-circle', 'text-green-500', 'bg-green-50 dark:bg-green-900/30');
    } catch (e) {
      console.error(e);
      if (t) { t.date = old; t.dueDate = oldDue; }
      render();
      showSystemToast('Не удалось перенести', e && e.code === 'permission-denied' ? 'У вас нет прав редактировать этот проект.' : 'Проверьте интернет и попробуйте ещё раз.', 'alert-triangle', 'text-red-500', 'bg-red-50 dark:bg-red-900/30');
    }
  }

  // ---------------- быстрое добавление ----------------
  function focusQuickAdd() { const i = document.getElementById('quickAddTitle'); i.focus({ preventScroll: window.innerWidth >= 1024 }); if (window.innerWidth < 1024) document.getElementById('dayPanel').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  document.getElementById('quickAddTitle').addEventListener('input', (e) => document.getElementById('quickAddMore').classList.toggle('hidden', !e.target.value.trim()));
  document.getElementById('quickAddTitle').addEventListener('focus', () => { if (document.getElementById('quickAddTitle').value.trim()) document.getElementById('quickAddMore').classList.remove('hidden'); });

  function updateQuickAddColumns() {
    const b = boardsMeta[document.getElementById('quickAddBoard').value];
    const sel = document.getElementById('quickAddColumn');
    if (!b) { sel.innerHTML = '<option value="">Колонка</option>'; sel.disabled = true; return; }
    const cols = (b.columns || []).filter((c) => !DONE_COL.test(c.name || ''));
    const all = cols.length ? cols : (b.columns || []);
    sel.innerHTML = all.length ? all.map((c) => `<option value="${esc(String(c.id))}">${esc(c.name || 'Колонка')}</option>`).join('') : '<option value="">Нет колонок</option>';
    sel.disabled = !all.length;
  }

  async function confirmQuickAddTask() {
    const title = document.getElementById('quickAddTitle').value.trim();
    const boardId = document.getElementById('quickAddBoard').value;
    const colRaw = document.getElementById('quickAddColumn').value;
    if (!title) return;
    if (!boardId || !colRaw) { document.getElementById('quickAddMore').classList.remove('hidden'); return showSystemToast('Куда сохранить?', 'Выберите проект и колонку.', 'alert-circle', 'text-amber-500', 'bg-amber-50 dark:bg-amber-900/30'); }
    const b = boardsMeta[boardId];
    const col = (b.columns || []).find((c) => String(c.id) === colRaw);
    const colId = col ? col.id : colRaw;
    const btn = document.getElementById('btnQuickSave');
    btn.disabled = true; btn.textContent = 'Сохраняем…';
    const cardId = 'card_' + Date.now();
    const card = { id: cardId, title, description: '', dueDate: selectedDate, columnId: colId, author: { id: currentUser.uid, name: currentUser.displayName }, archived: false, type: 'task', priority: 'normal', tags: [], comments: [], checklist: [], order: 99999, createdAt: new Date().toISOString() };
    try {
      if (b.isLocal) {
        const boards = JSON.parse(localStorage.getItem('blocko_local_boards')) || {};
        const c = (boards[boardId]?.columns || []).find((x) => String(x.id) === String(colId));
        if (!c) throw new Error('no column');
        (c.cards = c.cards || []).push(card);
        localStorage.setItem('blocko_local_boards', JSON.stringify(boards));
      } else {
        await db.collection('boards').doc(boardId).collection('cards').doc(cardId).set({ ...card, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      }
      allTasks.push({ ...card, boardId, colId, colName: col ? col.name : '', done: false, isLocal: b.isLocal, date: selectedDate });
      document.getElementById('quickAddTitle').value = '';
      document.getElementById('quickAddMore').classList.add('hidden');
      render();
      showSystemToast('Задача добавлена', `${b.title} · ${parseYmd(selectedDate).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}`, 'check-circle', 'text-green-500', 'bg-green-50 dark:bg-green-900/30');
    } catch (e) {
      console.error(e);
      showSystemToast('Не удалось сохранить', e && e.code === 'permission-denied' ? 'Нет прав добавлять задачи в этот проект.' : 'Попробуйте ещё раз.', 'alert-triangle', 'text-red-500', 'bg-red-50 dark:bg-red-900/30');
    } finally {
      btn.disabled = false; btn.textContent = 'Добавить';
    }
  }

  // ---------------- экспорт .ics ----------------
  function exportToICal() {
    const list = visibleTasks();
    if (!list.length) return showSystemToast('Нечего выгружать', 'В выбранных проектах нет задач со сроком.', 'info', 'text-blue-500', 'bg-blue-50 dark:bg-blue-900/30');
    const now = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    const escI = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
    let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Blocko Pro//Calendar//RU\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\nX-WR-CALNAME:Blocko Pro\r\n';
    list.forEach((t) => {
      const d = parseYmd(t.date); const e = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      ics += `BEGIN:VEVENT\r\nUID:${t.id}@blocko.cloud\r\nDTSTAMP:${now}\r\nDTSTART;VALUE=DATE:${t.date.replace(/-/g, '')}\r\nDTEND;VALUE=DATE:${ymd(e).replace(/-/g, '')}\r\nSUMMARY:${escI(t.title)} [${escI((boardsMeta[t.boardId] || {}).title)}]\r\nDESCRIPTION:${escI(t.description || 'Blocko Pro')}\r\nEND:VEVENT\r\n`;
    });
    ics += 'END:VCALENDAR';
    const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = 'Blocko_Calendar.ics'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    showSystemToast('Файл скачан', `Задач: ${list.length}. Откройте файл — они появятся в вашем календаре.`, 'download', 'text-green-500', 'bg-green-50 dark:bg-green-900/30');
  }

  // Клавиатура: ← → листают период, T — сегодня
  document.addEventListener('keydown', (e) => {
    if (/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) return;
    if (e.key === 'ArrowLeft') shiftPeriod(-1);
    if (e.key === 'ArrowRight') shiftPeriod(1);
    if (e.key === 't' || e.key === 'е') goToToday();
  });
  let lastWidthClass = window.innerWidth < 640;
  window.addEventListener('resize', () => { const now = window.innerWidth < 640; if (now !== lastWidthClass) { lastWidthClass = now; render(); } });
</script>
</body>
