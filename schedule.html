<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Управление графиками и расписанием — Blocko Pro</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f43f5e' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><polyline points='12 6 12 12 16 14'/></svg>" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    
    html, body { height: 100dvh; width: 100%; overflow: hidden; overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
    .glass-modal { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    
    @keyframes pulse-dot { 0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(244, 63, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); } }
    .time-indicator-dot { animation: pulse-dot 2s infinite; }
  </style>

  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { gray: { 750: '#2d3748', 850: '#1a202c', 900: '#0f172a', 950: '#0b0f19' } } } } }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 flex flex-col transition-colors duration-300 relative">

<div id="globalLoader" class="fixed inset-0 z-[2000] flex flex-col items-center justify-center bg-white dark:bg-gray-950 transition-all duration-700">
  <div class="flex flex-col items-center scale-110">
    <div class="bg-gradient-to-br from-rose-500 to-orange-500 p-4 rounded-3xl text-white shadow-2xl shadow-rose-500/40 mb-6">
      <i data-lucide="clock" class="w-12 h-12"></i>
    </div>
    <h2 class="text-3xl font-black tracking-tighter mb-4">SCHEDULE <span class="text-rose-500">ENGINE</span></h2>
    <div class="h-1 w-32 bg-gray-100 dark:bg-gray-800 rounded-full overflow-hidden relative">
      <div class="absolute top-0 left-0 h-full w-12 bg-rose-500 rounded-full animate-[pulse_1s_infinite]"></div>
    </div>
  </div>
</div>

<header class="px-4 md:px-6 py-3 md:py-4 border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur-xl sticky top-0 z-40 flex justify-between items-center flex-shrink-0">
  <div class="flex items-center gap-3">
    <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
      <i data-lucide="menu" class="w-5 h-5"></i>
    </button>
    
    <a href="index.html" class="hidden md:flex p-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all text-gray-500 active:scale-95">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
    </a>
    
    <div>
      <h1 class="text-lg md:text-xl font-bold tracking-tight leading-tight">Графики</h1>
      <p class="text-[9px] md:text-[10px] text-rose-500 font-bold uppercase tracking-widest flex items-center gap-1"><i data-lucide="shield-check" class="w-3 h-3"></i> Sync V2</p>
    </div>
  </div>

  <div class="flex items-center gap-2 md:gap-3">
    <button id="btnHeaderCopyKey" onclick="copyActiveShareKey()" class="hidden items-center gap-1.5 px-3 py-2 bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 font-bold text-xs rounded-xl transition-all">
      <i data-lucide="share-2" class="w-3.5 h-3.5"></i> <span class="hidden sm:inline">Ключ доступа</span>
    </button>
    <button onclick="exportToICal()" class="hidden md:flex items-center gap-2 px-3 py-2 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 text-gray-700 dark:text-gray-300 font-bold text-xs rounded-xl transition-all">
      <i data-lucide="download" class="w-4 h-4"></i> Экспорт
    </button>
    <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-400 transition-colors">
      <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i><i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
    </button>
  </div>
</header>

<div class="flex-1 flex overflow-hidden w-full h-[calc(100vh-65px)] md:h-[calc(100vh-73px)] relative">
  
  <div id="mobileOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden glass-modal opacity-0 transition-opacity"></div>

  <aside id="mainSidebar" class="absolute inset-y-0 left-0 z-50 w-[280px] md:w-[320px] bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 transform -translate-x-full md:translate-x-0 md:relative transition-transform duration-300 flex flex-col flex-shrink-0 shadow-2xl md:shadow-none">
    <div class="p-5 flex flex-col h-full overflow-hidden">
      
      <div class="flex p-1 bg-gray-100 dark:bg-gray-950 rounded-[14px] mb-5 border border-gray-200/50 dark:border-gray-800/50 shadow-inner">
         <button onclick="switchSidebarTab('files')" id="tabBtnFiles" class="flex-1 py-1.5 text-[11px] font-bold rounded-xl bg-white dark:bg-gray-800 text-gray-900 dark:text-white shadow-sm transition-all">📂 Файлы</button>
         <button onclick="switchSidebarTab('timeline')" id="tabBtnTimeline" class="flex-1 py-1.5 text-[11px] font-bold rounded-xl text-gray-500 hover:text-gray-900 dark:hover:text-white transition-all">📋 Хроника</button>
      </div>

      <div id="tabContentFiles" class="flex-1 flex flex-col overflow-hidden animate-fade-in">
        <div class="flex-1 overflow-y-auto hide-scroll pb-2" id="foldersContainer">
          </div>

        <div class="mt-4 pt-4 border-t border-gray-150 dark:border-gray-800 space-y-3">
          <div class="bg-gray-50 dark:bg-gray-950/50 p-3.5 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-inner">
            <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 block flex items-center gap-1"><i data-lucide="cloud-lightning" class="w-3 h-3 text-amber-500"></i> Подключить Live-график</label>
            <input type="text" id="shareKeyInput" placeholder="Введите ключ..." class="w-full px-3 py-2 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-xs outline-none dark:text-white focus:border-rose-500 transition-all font-mono mb-2">
            <button onclick="connectScheduleByKey()" class="w-full py-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-xl font-bold text-xs hover:opacity-90 active:scale-95 transition-all">Подключить</button>
          </div>
          
          <label class="w-full flex items-center justify-center gap-2 px-4 py-2.5 border-2 border-dashed border-gray-300 dark:border-gray-700 hover:border-rose-500 rounded-xl cursor-pointer transition-all bg-gray-50 dark:bg-gray-950">
            <i data-lucide="upload-cloud" class="w-4 h-4 text-gray-400"></i>
            <span class="text-xs font-bold text-gray-500">Импорт JSON</span>
            <input type="file" id="importScheduleInput" accept=".json" class="hidden" onchange="importScheduleFile(event)">
          </label>
        </div>
      </div>

      <div id="tabContentTimeline" class="flex-1 flex flex-col overflow-hidden hidden animate-fade-in">

           <input type="text" id="searchTimeline" oninput="filterTimelineList()" placeholder="Поиск смен..." class="w-full bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl pl-9 pr-4 py-2.5 text-xs outline-none dark:text-white focus:border-rose-500 transition-colors">
        </div>
        <div id="scheduleTimelineList" class="flex-1 overflow-y-auto hide-scroll space-y-2 pb-2">

      </div>
    </div>
  </aside>

  <main class="flex-1 flex flex-col min-w-0 bg-gray-50/30 dark:bg-[#0b0f19]">
    
    <div class="px-4 py-3 md:px-6 md:py-4 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md z-20 border-b border-gray-200 dark:border-gray-800 flex flex-col shadow-sm">
       <div class="flex justify-between items-center mb-3">
          <div class="flex items-center gap-3">
             <div class="w-8 h-8 rounded-full bg-gradient-to-br from-rose-400 to-orange-500 flex items-center justify-center text-white shadow-lg shadow-rose-500/20">

          </div>
          
          <button id="btnOpenShiftModal" onclick="openShiftModal()" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-xs shadow-md shadow-rose-500/20 active:scale-95 transition-all flex items-center gap-1.5">
             <i data-lucide="plus" class="w-4 h-4"></i> <span class="hidden sm:inline">Добавить</span>
          </button>
       </div>

       <div class="flex justify-between items-center w-full mb-3">
          <div class="flex items-center gap-1">
             <button onclick="changeViewDate(-1)" class="p-1.5 bg-gray-100 dark:bg-gray-800 rounded-lg hover:text-rose-500 transition-all"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
             <h3 id="currentGridDateTitle" class="text-xs font-black text-gray-900 dark:text-white tracking-tight w-36 text-center uppercase truncate">Дата</h3>
             <button onclick="changeViewDate(1)" class="p-1.5 bg-gray-100 dark:bg-gray-800 rounded-lg hover:text-rose-500 transition-all"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
          </div>
          <div class="flex items-center gap-2">
             <div id="dailyTotalBadge" class="flex items-center gap-1 px-2 py-1 bg-gray-100 dark:bg-gray-800/80 text-gray-600 dark:text-gray-300 rounded-md text-[10px] font-bold">
                <i data-lucide="clock-4" class="w-3 h-3 text-rose-500"></i> <span id="dailyTotalHours">0 ч</span>
             </div>
             <button onclick="setViewToToday()" class="px-2.5 py-1 border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 text-[10px] font-bold rounded-md transition-all">Сегодня</button>
          </div>
       </div>

       <div id="weekDaysBar" class="flex items-center justify-between w-full gap-1.5 overflow-x-auto hide-scroll pb-1 px-1">
          </div>
    </div>

    <div class="flex-1 overflow-y-auto p-2 sm:p-4 relative hide-scroll" id="hourlyGridWrapper">
    </div>

  </main>
</div>

<div id="shiftModal" class="fixed inset-0 z-[500] hidden items-center justify-center bg-gray-900/60 dark:bg-black/70 glass-modal opacity-0 transition-opacity duration-300 px-4">
  <div class="bg-white dark:bg-gray-900 w-full max-w-sm rounded-[2rem] shadow-2xl border border-gray-200 dark:border-gray-800 overflow-hidden transform scale-95 transition-transform duration-300" id="shiftModalContent">
    
    <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center bg-gray-50/50 dark:bg-gray-900/50">
       <h3 id="modalTitle" class="font-bold text-sm text-gray-900 dark:text-white flex items-center gap-2"><i data-lucide="calendar-plus" class="w-4 h-4 text-rose-500"></i> Запланировать</h3>
       <button onclick="closeShiftModal()" class="text-gray-400 hover:text-gray-700 dark:hover:text-white p-1.5 rounded-full transition-all bg-gray-100 dark:bg-gray-800 hover:bg-gray-200"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>

    <div class="p-5 space-y-4">
      <input type="hidden" id="schEditId" value="">

      <div>
        <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Название / Задача</label>
        <input type="text" id="schTitle" placeholder="Смена на складе..." class="w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl text-sm outline-none dark:text-white focus:border-rose-500 transition-all font-medium">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Дата</label>
          <input type="date" id="schDate" class="w-full px-3 py-2.5 bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl text-sm outline-none dark:text-white focus:border-rose-500 transition-all font-bold">
        </div>
        <div class="flex gap-2">
          <div>
            <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Старт</label>
            <input type="time" id="schStart" value="09:00" class="w-full px-2 py-2.5 bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl text-sm outline-none dark:text-white focus:border-rose-500 transition-all font-bold">
          </div>
          <div>
            <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Конец</label>
            <input type="time" id="schEnd" value="18:00" class="w-full px-2 py-2.5 bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl text-sm outline-none dark:text-white focus:border-rose-500 transition-all font-bold">
          </div>
        </div>
      </div>

      <div>
         <label class="text-[10px] font-bold text-gray-400 uppercase mb-2 block">Цвет метки</label>
         <div class="flex gap-3 justify-between" id="colorPickerContainer">
            <button onclick="selectShiftColor('rose')" data-color="rose" class="color-btn w-7 h-7 rounded-full bg-rose-500 border-2 border-transparent hover:scale-110 transition-transform ring-offset-2 dark:ring-offset-gray-900 ring-2 ring-rose-500"></button>
            <button onclick="selectShiftColor('blue')" data-color="blue" class="color-btn w-7 h-7 rounded-full bg-blue-500 border-2 border-transparent hover:scale-110 transition-transform ring-offset-2 dark:ring-offset-gray-900"></button>
            <button onclick="selectShiftColor('emerald')" data-color="emerald" class="color-btn w-7 h-7 rounded-full bg-emerald-500 border-2 border-transparent hover:scale-110 transition-transform ring-offset-2 dark:ring-offset-gray-900"></button>
            <button onclick="selectShiftColor('amber')" data-color="amber" class="color-btn w-7 h-7 rounded-full bg-amber-500 border-2 border-transparent hover:scale-110 transition-transform ring-offset-2 dark:ring-offset-gray-900"></button>
            <button onclick="selectShiftColor('purple')" data-color="purple" class="color-btn w-7 h-7 rounded-full bg-purple-500 border-2 border-transparent hover:scale-110 transition-transform ring-offset-2 dark:ring-offset-gray-900"></button>
         </div>
      </div>

      <div id="duplicationBlock" class="bg-indigo-50/50 dark:bg-indigo-900/10 p-3 rounded-2xl border border-indigo-100 dark:border-indigo-900/30">
        <label class="text-[9px] font-black text-indigo-500 dark:text-indigo-400 uppercase tracking-widest mb-2 block flex items-center gap-1"><i data-lucide="copy-check" class="w-3 h-3"></i> Размножить смену на неделю</label>
        <div class="flex justify-between gap-1" id="duplicationDaysWrapper"></div>
      </div>

      <button id="btnSaveShift" onclick="saveScheduleItem()" class="w-full py-3.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-sm shadow-lg shadow-rose-500/30 active:scale-95 transition-all flex items-center justify-center gap-2">

      </button>

<div id="customDialogOverlay" class="fixed inset-0 z-[1000] hidden items-center justify-center bg-gray-900/60 dark:bg-black/70 glass-modal opacity-0 transition-opacity duration-300 px-4">
  <div class="bg-white dark:bg-gray-900 w-full max-w-sm rounded-[2rem] shadow-2xl border border-gray-200 dark:border-gray-800 p-6 transform scale-95 transition-transform duration-300 flex flex-col" id="customDialogContent">
    <div class="flex items-center gap-3 mb-3" id="dialogHeader">
        </div>
    <p id="dialogMessage" class="text-sm text-gray-500 dark:text-gray-400 mb-5 leading-relaxed"></p>
    
    <input type="text" id="dialogInput" class="hidden w-full px-4 py-3 bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-800 rounded-xl text-sm outline-none dark:text-white focus:border-rose-500 transition-all mb-5">
    
    <div class="flex gap-3 justify-end mt-auto" id="dialogButtons">
       </div>
  </div>
</div>

<div id="globalToast" class="fixed bottom-6 right-6 z-[1000] transform translate-y-24 opacity-0 transition-all duration-500 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-4 rounded-2xl shadow-2xl flex items-start gap-3 max-w-[300px] pointer-events-none">
  <div id="toastIconBg" class="p-2 rounded-full flex-shrink-0 bg-rose-50 dark:bg-rose-900/30"><i id="toastIcon" data-lucide="info" class="w-4 h-4 text-rose-500"></i></div>
  <div><h4 id="toastTitle" class="text-[13px] font-bold text-gray-900 dark:text-white mb-0.5 leading-tight">Уведомление</h4><p id="toastDesc" class="text-[11px] text-gray-500 leading-tight"></p></div>
</div>

<script>
  let currentUser = null;
  // ВАЖНО: Мы больше не хардкодим пустую папку, она создастся с файлом по-умолчанию при инициализации
  let folders = JSON.parse(localStorage.getItem('blocko_sch_folders')) || {};
  let currentFileId = localStorage.getItem('blocko_sch_current_id') || 'primary';
  let activeScheduleData = { id: 'primary', title: 'Мой первый график', folder: 'Основной Проект', items: [], owner: '' };
  
  let unsubSharedStream = null; 
  let selectedDuplicationDays = [];
  let viewDate = new Date();
  let currentSelectedColor = 'rose';

  const UI_COLORS = {
     rose: { border: 'border-rose-500', bg: 'bg-rose-500/10 dark:bg-rose-500/20', text: 'text-rose-600 dark:text-rose-400' },
     blue: { border: 'border-blue-500', bg: 'bg-blue-500/10 dark:bg-blue-500/20', text: 'text-blue-600 dark:text-blue-400' },
     emerald: { border: 'border-emerald-500', bg: 'bg-emerald-500/10 dark:bg-emerald-500/20', text: 'text-emerald-600 dark:text-emerald-400' },
     amber: { border: 'border-amber-500', bg: 'bg-amber-500/10 dark:bg-amber-500/20', text: 'text-amber-600 dark:text-amber-400' },
     purple: { border: 'border-purple-500', bg: 'bg-purple-500/10 dark:bg-purple-500/20', text: 'text-purple-600 dark:text-purple-400' }
  };

  const escapeHTML = (str) => str ? String(str).replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t)) : '';

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('schDate').value = viewDate.toISOString().split('T')[0];
    lucide.createIcons();
    renderDuplicationButtons();
    setInterval(updateTimeIndicator, 60000); 

    // Глобальное закрытие окон по Escape
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            const shiftModal = document.getElementById('shiftModal');
            const customDialog = document.getElementById('customDialogOverlay');
            if (!shiftModal.classList.contains('hidden')) closeShiftModal();
            if (!customDialog.classList.contains('hidden')) closeCustomDialog();
        }
    });
  });

  // ==========================================
  // ДВИЖОК КАСТОМНЫХ ДИАЛОГОВ (EXPERT UI)
  // ==========================================
  let dialogCallback = null;

  function closeCustomDialog() {
      const overlay = document.getElementById('customDialogOverlay');
      const content = document.getElementById('customDialogContent');
      overlay.classList.add('opacity-0');
      content.classList.remove('scale-100');
      content.classList.add('scale-95');
      setTimeout(() => {
          overlay.classList.remove('flex');
          overlay.classList.add('hidden');
          document.getElementById('dialogInput').value = '';
          dialogCallback = null;
      }, 300);
  }

  function showCustomDialogBase(options) {
      const overlay = document.getElementById('customDialogOverlay');
      const content = document.getElementById('customDialogContent');
      
      document.getElementById('dialogHeader').innerHTML = `
         <div class="p-2 rounded-xl bg-${options.color || 'rose'}-100 dark:bg-${options.color || 'rose'}-900/30 text-${options.color || 'rose'}-500">
            <i data-lucide="${options.icon || 'info'}" class="w-5 h-5"></i>
         </div>
         <h3 class="text-base font-bold text-gray-900 dark:text-white">${options.title}</h3>
      `;
      document.getElementById('dialogMessage').innerHTML = options.message;
      
      const input = document.getElementById('dialogInput');
      if (options.type === 'prompt') {
          input.classList.remove('hidden');
          input.placeholder = options.placeholder || '';
          setTimeout(() => input.focus(), 300);
      } else {
          input.classList.add('hidden');
      }

      let buttonsHtml = `<button onclick="closeCustomDialog()" class="px-4 py-2 text-sm font-bold text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 transition-colors bg-gray-100 dark:bg-gray-800 rounded-xl">Отмена</button>`;
      
      if (options.type === 'alert') buttonsHtml = ''; // Для алерта кнопка отмены не нужна
      
      buttonsHtml += `<button id="btnDialogAction" class="px-4 py-2 text-sm font-bold bg-${options.color || 'rose'}-600 hover:bg-${options.color || 'rose'}-500 text-white rounded-xl shadow-lg shadow-${options.color || 'rose'}-500/30 transition-all active:scale-95">${options.confirmText || 'ОК'}</button>`;
      
      document.getElementById('dialogButtons').innerHTML = buttonsHtml;
      lucide.createIcons({ root: document.getElementById('dialogHeader') });

      dialogCallback = options.callback;

      document.getElementById('btnDialogAction').onclick = () => {
          if (options.type === 'prompt') {
              const val = input.value.trim();
              if (dialogCallback) dialogCallback(val);
          } else {
              if (dialogCallback) dialogCallback(true);
          }
          closeCustomDialog();
      };

  async function loadStructureFromCloud() {
      let isFirstTime = false;
      if (navigator.onLine && currentUser) {
          try {
              const doc = await db.collection('users').doc(currentUser.uid).get();
              if (doc.exists && doc.data().scheduleFolders) {
                  folders = Object.assign({}, doc.data().scheduleFolders);
                  localStorage.setItem('blocko_sch_folders', JSON.stringify(folders));
              } else {
                  isFirstTime = true;
              }
          } catch(e) {}
      } else {
          if (!localStorage.getItem('blocko_sch_folders')) isFirstTime = true;
      }

      // ЛОГИКА "ПЕРВОГО ФАЙЛА": Если папки нет или она пуста, создаем физический файл
      if(!folders["Основной Проект"]) folders["Основной Проект"] = [];
      if (folders["Основной Проект"].length === 0 || isFirstTime) {
          // Создаем файл "primary", чтобы он был виден в UI как реальный файл
          folders["Основной Проект"].push({ id: 'primary', title: 'Мой первый график', isShared: false });
          saveStructureToCloud();
      }

      renderFoldersTree();
  }

  async function saveStructureToCloud() {
      localStorage.setItem('blocko_sch_folders', JSON.stringify(folders));
      renderFoldersTree();
      if (navigator.onLine && currentUser) {
          try { await db.collection('users').doc(currentUser.uid).set({ scheduleFolders: folders }, { merge: true }); } catch(e) {}
      }
  }

  // --- ЛОГИКА ЗАГРУЗКИ ФАЙЛА ---
  async function selectScheduleFile(fileId, forcedTitle = '', forcedFolder = '') {
      currentFileId = fileId;
      localStorage.setItem('blocko_sch_current_id', fileId);
      
      const btnAdd = document.getElementById('btnOpenShiftModal');
      const btnKey = document.getElementById('btnHeaderCopyKey');
      
      if (unsubSharedStream) {
          unsubSharedStream();
          unsubSharedStream = null;
      }

      if (window.innerWidth < 768) toggleSidebar(); 

      let fileMeta = null;
      Object.keys(folders).forEach(fol => {
          const found = folders[fol].find(f => f.id === fileId);
          if (found) { fileMeta = found; fileMeta.folder = fol; }
      });

      const title = fileMeta ? fileMeta.title : forcedTitle || 'Мой график';
      const folderName = fileMeta ? fileMeta.folder : forcedFolder || 'Основной Проект';
      
      document.getElementById('activeFileName').innerText = title;
      document.getElementById('activeFileDesc').innerText = folderName;

      // ЛОГИКА ДЛЯ РАСШАРЕННОГО ФАЙЛА
      if (fileMeta && fileMeta.isShared) {
          document.getElementById('activeFileName').innerText = `👀 ${title}`;
          btnAdd.classList.add('hidden'); 
          btnKey.classList.add('hidden');
          
          showSystemToast("Синхронизация", "Загрузка данных...", "refresh-cw", "text-blue-500 animate-spin", "bg-blue-50");
          
          if (navigator.onLine) {
             unsubSharedStream = db.collection('schedules_v2').doc(fileId).onSnapshot((doc) => {
                 if (doc.exists) {
                     activeScheduleData = doc.data();
                     renderActiveSchedule();
                 } else {
                     SysDialog.alert("Ошибка доступа", "Владелец удалил этот график или закрыл доступ.");
                     activeScheduleData = { id: fileId, title: title, items: [], owner: '' };
                     renderActiveSchedule();
                 }
             }, () => {
                 showSystemToast("Ошибка", "Нет прав для чтения графика.", "shield-alert", "text-red-500", "bg-red-50");
             });
          } else {
             let cached = localStorage.getItem('blocko_sch_data_' + fileId);
             activeScheduleData = cached ? JSON.parse(cached) : { id: fileId, title: title, items: [] };
             renderActiveSchedule();
          }
          if(typeof renderFoldersTree === 'function') renderFoldersTree();
          return;
      }

      // ЛОГИКА ДЛЯ СВОЕГО ФАЙЛА
      btnAdd.classList.remove('hidden');
      btnKey.classList.remove('hidden');

      let cached = localStorage.getItem('blocko_sch_data_' + fileId);
      if (cached) activeScheduleData = JSON.parse(cached);
      else activeScheduleData = { id: fileId, title: title, folder: folderName, items: [], owner: currentUser.uid };

      if (navigator.onLine) {
          try {
              const doc = await db.collection('schedules_v2').doc(fileId).get();
              if (doc.exists) {
                  activeScheduleData = doc.data();
                  localStorage.setItem('blocko_sch_data_' + fileId, JSON.stringify(activeScheduleData));
              } else {
                  await db.collection('schedules_v2').doc(fileId).set(activeScheduleData);
              }
          } catch(e){}
      }
      renderActiveSchedule();
      if(typeof renderFoldersTree === 'function') renderFoldersTree();
  }

      if(!key) return;
      
      showSystemToast("Проверка...", "Ищем расписание в облаке...", "loader-2", "text-blue-500 animate-spin", "bg-blue-50");
      if (!navigator.onLine) return SysDialog.alert("Нет сети", "Для подключения графика нужен интернет.");

      try {
          const doc = await db.collection('schedules_v2').doc(key).get();
          if (!doc.exists) return SysDialog.alert("Неверный ключ", "Файл не найден. Проверьте правильность ключа доступа.");
          
          const remoteData = doc.data();
          if (!folders["Подключенные графики"]) folders["Подключенные графики"] = [];
          
          if(!folders["Подключенные графики"].some(f => f.id === key)) {
              folders["Подключенные графики"].push({ id: key, title: remoteData.title + ' (Копия)', isShared: true });

          document.getElementById('shareKeyInput').value = '';
          showSystemToast("Успех!", `График "${remoteData.title}" подключен.`, "check", "text-emerald-500", "bg-emerald-50");
          selectScheduleFile(key);
      } catch(err) {
          SysDialog.alert("Ошибка доступа", "У вас нет прав на просмотр этого файла.");
      }
  }

  function calculateDailyHours(dayShifts) {
      let totalMin = 0;
      dayShifts.forEach(s => {
          let [startH, startM] = s.timeStart.split(':').map(Number);
          let [endH, endM] = s.timeEnd.split(':').map(Number);
          let startTotal = startH * 60 + startM;
          let endTotal = endH * 60 + endM;
          if(endTotal < startTotal) endTotal += 24 * 60; 
          totalMin += (endTotal - startTotal);
      });
      let h = Math.floor(totalMin / 60);
      let m = totalMin % 60;
      let res = [];
      if(h > 0) res.push(`${h} ч`);
      if(m > 0) res.push(`${m} мин`);
      return res.length > 0 ? res.join(' ') : '0 ч';
  }

  function renderWeekBar() {
      const bar = document.getElementById('weekDaysBar');
      if(!bar) return;

      const currentDay = new Date(viewDate);
      const dayOfWeek = currentDay.getDay();
      const distanceToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      
      const monday = new Date(currentDay);
      monday.setDate(currentDay.getDate() + distanceToMonday);

      let html = '';
      const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      
      for(let i = 0; i < 7; i++) {
          const iterDate = new Date(monday);
          iterDate.setDate(monday.getDate() + i);
          const iterDateStr = iterDate.toISOString().split('T')[0];
          const isSelected = iterDateStr === viewDate.toISOString().split('T')[0];
          
          const activeClass = isSelected 
              ? 'bg-rose-500 text-white shadow-md shadow-rose-500/30' 
              : 'bg-white dark:bg-gray-800 text-gray-500 border border-gray-200 dark:border-gray-700 hover:border-rose-300 dark:hover:border-rose-700';

          html += `
             <button onclick="setSpecificDate('${iterDateStr}')" class="flex-1 flex flex-col items-center justify-center py-1.5 px-1 rounded-xl transition-all active:scale-95 min-w-[38px] ${activeClass}">
                <span class="text-[8px] sm:text-[9px] uppercase font-bold opacity-80 mb-0.5">${dayNames[i]}</span>
                <span class="text-xs sm:text-sm font-black leading-none">${iterDate.getDate()}</span>
             </button>
          `;
      }
      bar.innerHTML = html;
  }

  function renderHourlyGrid() {

      const dateStr = viewDate.toISOString().split('T')[0];
      
      const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById('currentGridDateTitle').innerText = viewDate.toLocaleDateString('ru-RU', options);

      const dayShifts = (activeScheduleData.items || []).filter(s => s.date === dateStr);
      document.getElementById('dailyTotalHours').innerText = calculateDailyHours(dayShifts);

      let html = '';
      const canEditAll = activeScheduleData.owner === currentUser.uid || currentFileId === 'primary';
      
      if (dayShifts.length === 0) {
         html = `
           <div class="absolute inset-0 flex flex-col items-center justify-center opacity-50 pointer-events-none z-0">
              <i data-lucide="coffee" class="w-12 h-12 text-gray-300 dark:text-gray-700 mb-3"></i>
              <p class="text-xs font-bold text-gray-400 dark:text-gray-600">Свободный день</p>
           </div>
         `;
      }
      
      for (let hour = 0; hour < 24; hour++) {
          const currentHourStr = String(hour).padStart(2, '0') + ':00';
          
          const shiftsInThisHour = dayShifts.filter(s => {
              const startH = parseInt(s.timeStart.split(':')[0]);
              const endH = parseInt(s.timeEnd.split(':')[0]);
              return hour >= startH && hour <= endH;
          });

          let blocksHtml = shiftsInThisHour.map(s => {
              const isStartHour = parseInt(s.timeStart.split(':')[0]) === hour;
              const style = UI_COLORS[s.color || 'rose'];
              
              return `
                <div ${canEditAll ? `onclick="event.stopPropagation(); openShiftModal('${s.id}')"` : ''} class="${style.bg} ${style.text} border-l-[3px] ${style.border} px-3 py-1.5 sm:py-2 rounded-r-xl text-xs flex items-center justify-between shadow-sm animate-fade-in w-full backdrop-blur-sm ${canEditAll ? 'cursor-pointer hover:opacity-90' : ''}">
                  <div class="truncate">
                     <span class="font-extrabold block truncate text-xs sm:text-[13px]">${isStartHour ? escapeHTML(s.title) : '<span class="opacity-60 font-medium">... продолжение</span>'}</span>
                     <span class="text-[9px] sm:text-[10px] opacity-80 font-bold">${s.timeStart} - ${s.timeEnd}</span>
                  </div>
                  ${canEditAll && isStartHour ? `
                     <button onclick="event.stopPropagation(); deleteShiftItem('${s.id}')" class="p-1 hover:text-red-500 transition-colors bg-white/50 dark:bg-gray-900/50 rounded-md focus:outline-none"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                  ` : ''}
                </div>
              `;
          }).join('');

          html += `
            <div onclick="setFormTimeSlot(${hour})" class="flex items-start gap-3 p-1.5 sm:p-2 min-h-[60px] sm:min-h-[68px] border-b border-gray-200/50 dark:border-gray-800/50 hover:bg-white dark:hover:bg-gray-900/40 transition-colors cursor-pointer group relative z-10">
               <div class="w-10 sm:w-12 text-right text-[10px] sm:text-xs font-black text-gray-300 dark:text-gray-700 group-hover:text-rose-400 transition-colors tabular-nums pt-1">${currentHourStr}</div>
               <div class="flex-1 flex flex-col gap-1 w-full pointer-events-auto">
                  ${blocksHtml}
               </div>
            </div>
          `;
      }

      grid.innerHTML = html;
      lucide.createIcons({ root: grid });
      
      if (grid.scrollTop === 0) {
          const rowElements = grid.querySelectorAll('.flex.items-start');
          if (rowElements && rowElements[8]) {
             grid.scrollTo({ top: rowElements[8].offsetTop - 20, behavior: 'auto' });
          }
      }

      updateTimeIndicator();
  }

  function updateTimeIndicator() {
      const grid = document.getElementById('hourlyGridWrapper');
      if(!grid) return;
      
      const oldInd = document.getElementById('currentTimeIndicator');
      if(oldInd) oldInd.remove();

      const todayStr = new Date().toISOString().split('T')[0];
      const viewStr = viewDate.toISOString().split('T')[0];
      if (todayStr !== viewStr) return;

      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      
      const rowElements = grid.querySelectorAll('.flex.items-start.gap-3');
      if(rowElements && rowElements[h]) {
         const targetRow = rowElements[h];
         const percentOfHour = m / 60;
         const rowHeight = targetRow.offsetHeight;
         const topOffset = targetRow.offsetTop + (rowHeight * percentOfHour);

         const indicator = document.createElement('div');
         indicator.id = 'currentTimeIndicator';
         indicator.className = 'absolute left-2 sm:left-4 right-2 sm:right-4 z-20 flex items-center pointer-events-none transition-all duration-1000';
         indicator.style.top = `${topOffset}px`;
         
         indicator.innerHTML = `
            <div class="time-indicator-dot w-2 h-2 rounded-full bg-rose-500 -ml-1"></div>
            <div class="h-[1.5px] bg-rose-500/70 w-full shadow-[0_0_8px_rgba(244,63,94,0.6)]"></div>
         `;
         grid.appendChild(indicator);
      }
  }

  function setFormTimeSlot(hour) {
      if (document.getElementById('btnOpenShiftModal').classList.contains('hidden')) return; 
      const startH = String(hour).padStart(2, '0') + ':00';
      const endH = String(Math.min(hour + 1, 23)).padStart(2, '0') + ':00';
      document.getElementById('schStart').value = startH;
      document.getElementById('schEnd').value = endH;
      openShiftModal();
  }

  // --- ЛОГИКА СОХРАНЕНИЯ СМЕНЫ ---
  function toggleDuplicationDay(dayNum) {
      const btn = document.querySelector(`[data-day="${dayNum}"]`);
      if (selectedDuplicationDays.includes(dayNum)) {
          selectedDuplicationDays = selectedDuplicationDays.filter(d => d !== dayNum);
          btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600');
          btn.classList.add('bg-white', 'dark:bg-gray-900', 'text-gray-500');
      } else {
          selectedDuplicationDays.push(dayNum);
          btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');
          btn.classList.remove('bg-white', 'dark:bg-gray-900', 'text-gray-500');
      }
  }

  async function saveScheduleItem() {
      const title = document.getElementById('schTitle').value.trim() || 'Смена';
      const baseDateStr = document.getElementById('schDate').value;
      const timeStart = document.getElementById('schStart').value;
      const timeEnd = document.getElementById('schEnd').value;
      const editId = document.getElementById('schEditId').value;

      if (!baseDateStr) return showSystemToast("Ошибка", "Выберите дату.", "alert-circle", "text-red-500", "bg-red-50");
      if (!activeScheduleData.items) activeScheduleData.items = [];

      if (editId) {
          const index = activeScheduleData.items.findIndex(s => s.id === editId);
          if (index !== -1) {
              activeScheduleData.items[index] = { ...activeScheduleData.items[index], title, date: baseDateStr, timeStart, timeEnd, color: currentSelectedColor };
          }
      } else {
          const baseId = 'shift_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
          activeScheduleData.items.push({ id: baseId, title, date: baseDateStr, timeStart, timeEnd, color: currentSelectedColor });

          if (selectedDuplicationDays.length > 0) {
              const currentBaseDate = new Date(baseDateStr);
              const currentDayOfWeek = currentBaseDate.getDay(); 
              const distanceToMonday = currentDayOfWeek === 0 ? -6 : 1 - currentDayOfWeek;
              
              const mondayDate = new Date(currentBaseDate);
              mondayDate.setDate(currentBaseDate.getDate() + distanceToMonday);

              selectedDuplicationDays.forEach(dayIndex => {
                  const targetDate = new Date(mondayDate);
                  targetDate.setDate(mondayDate.getDate() + (dayIndex - 1));
                  const targetDateStr = targetDate.toISOString().split('T')[0];
                  
                  if (targetDateStr !== baseDateStr) {
                      const duplicatedId = 'shift_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                      activeScheduleData.items.push({
                          id: duplicatedId, title: title, date: targetDateStr, timeStart: timeStart, timeEnd: timeEnd, color: currentSelectedColor
                      });
                  }
              });
          }
      }

      await commitActiveSchedule();
      closeShiftModal();
      showSystemToast("Готово", editId ? "Смена обновлена." : "Смены добавлены.", "check-circle", "text-emerald-500", "bg-emerald-50");
  }

  function deleteShiftItem(id) {
      SysDialog.confirm("Удалить запись?", "Эта смена будет стерта из графика.", async () => {
          activeScheduleData.items = (activeScheduleData.items || []).filter(s => s.id !== id);
          await commitActiveSchedule();
          showSystemToast("Удалено", "Запись стерта.", "trash-2", "text-gray-500", "bg-gray-100");
      }, true);
  }

  async function commitActiveSchedule() {
      localStorage.setItem('blocko_sch_data_' + currentFileId, JSON.stringify(activeScheduleData));
      renderActiveSchedule();
      if (navigator.onLine && currentFileId !== 'primary') {
          try { await db.collection('schedules_v2').doc(currentFileId).set(activeScheduleData, { merge: true }); } catch(e) {}
      }
  }

  // --- ПРОЧИЕ УТИЛИТЫ ---
  function changeViewDate(offset) { viewDate.setDate(viewDate.getDate() + offset); renderHourlyGrid(); renderWeekBar(); }
  function setViewToToday() { viewDate = new Date(); renderHourlyGrid(); renderWeekBar(); }
  
  function copyActiveShareKey() {
      if(currentFileId === 'primary') return;
      navigator.clipboard.writeText(currentFileId);
      showSystemToast("Ключ скопирован", "Передайте ID коллегам.", "copy", "text-indigo-500", "bg-indigo-50");
  }

  function downloadActiveSchedule() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(activeScheduleData));
      const dlAnchor = document.createElement('a'); dlAnchor.setAttribute("href", dataStr); dlAnchor.setAttribute("download", `blocko_schedule.json`);
      document.body.appendChild(dlAnchor); dlAnchor.click(); dlAnchor.remove();
  }

  function importScheduleFile(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
          try {
              const imported = JSON.parse(e.target.result);
              if (!imported.title || !Array.isArray(imported.items)) throw new Error();
              const newId = 'sch_file_' + Date.now();
              imported.id = newId; imported.owner = currentUser.uid;

              const firstFolder = Object.keys(folders)[0] || "Импортированные";
              if(!folders[firstFolder]) folders[firstFolder] = [];
              folders[firstFolder].push({ id: newId, title: imported.title, isShared: false });
              
              localStorage.setItem('blocko_sch_data_' + newId, JSON.stringify(imported));
              await saveStructureToCloud(); await selectScheduleFile(newId);
              showSystemToast("Импорт", "Файл загружен.", "check", "text-emerald-500", "bg-emerald-50");
          } catch(err) { SysDialog.alert("Ошибка файла", "Файл поврежден или имеет неверный формат."); }
      };
      reader.readAsText(file);
  }

  function exportToICal() {
      const items = activeScheduleData.items || [];
      if (items.length === 0) return SysDialog.alert("Пустой график", "В этом файле нет смен для экспорта.");
      let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Blocko Pro//Schedule Engine//RU\nCALSCALE:GREGORIAN\n";
      items.forEach(i => {
          const start = i.date.replace(/-/g, '') + 'T' + i.timeStart.replace(/:/g, '') + '00';
          const end = i.date.replace(/-/g, '') + 'T' + i.timeEnd.replace(/:/g, '') + '00';
          ics += `BEGIN:VEVENT\nUID:${i.id}@blocko.pro\nDTSTART:${start}\nDTEND:${end}\nSUMMARY:${i.title}\nEND:VEVENT\n`;
      });
      ics += "END:VCALENDAR";
      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `Schedule.ics`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  function showSystemToast(title, desc, iconName, iconColor, bgColor) {
      const toast = document.getElementById('globalToast');
      document.getElementById('toastTitle').innerText = title;
      document.getElementById('toastDesc').innerText = desc;
      const iconEl = document.getElementById('toastIcon');
      iconEl.setAttribute('data-lucide', iconName);
      iconEl.className = `w-4 h-4 ${iconColor}`;
      document.getElementById('toastIconBg').className = `p-2 rounded-full flex-shrink-0 ${bgColor}`;
      lucide.createIcons({ root: toast });

      toast.classList.remove('translate-y-24', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 4000);
  }
</script>
