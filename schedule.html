<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>График работы — Blocko Pro</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
  </style>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { gray: { 750: '#2d3748', 850: '#1a202c', 900: '#0f172a', 950: '#0b0f19' } } } } }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 h-[100dvh] w-full flex flex-col transition-colors duration-300">

<header class="px-8 py-5 border-b border-gray-200 dark:border-gray-800 bg-white/70 dark:bg-gray-900/70 backdrop-blur-xl sticky top-0 z-50 flex justify-between items-center">
  <div class="flex items-center gap-4">
    <a href="index.html" class="p-2.5 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-all text-gray-500">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </a>
    <div>
      <h1 class="text-xl font-bold tracking-tight">График работы</h1>
      <p class="text-[10px] text-rose-500 font-bold uppercase tracking-widest mt-0.5">Управление расписанием</p>
    </div>
  </div>
</header>

<main class="p-4 sm:p-8 max-w-4xl mx-auto w-full flex-1 flex flex-col gap-6">
  
  <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-6 rounded-[2rem] shadow-sm">
    <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i data-lucide="plus-circle" class="w-5 h-5 text-rose-500"></i> Добавить смену / событие</h3>
    
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="md:col-span-2">
        <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Название (смена, встреча)</label>
        <input type="text" id="schTitle" placeholder="Например: Рабочая смена" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm outline-none dark:text-white focus:border-rose-500 transition-all">
      </div>
      <div>
        <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Дата</label>
        <input type="date" id="schDate" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm outline-none dark:text-white focus:border-rose-500 transition-all">
      </div>
      <div class="flex gap-2">
        <div class="w-1/2">
          <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Начало</label>
          <input type="time" id="schStart" value="09:00" class="w-full px-2 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm outline-none dark:text-white focus:border-rose-500 transition-all">
        </div>
        <div class="w-1/2">
          <label class="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Конец</label>
          <input type="time" id="schEnd" value="18:00" class="w-full px-2 py-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm outline-none dark:text-white focus:border-rose-500 transition-all">
        </div>
      </div>
    </div>
    
    <button onclick="addScheduleItem()" class="mt-4 px-6 py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl shadow-lg shadow-rose-500/30 active:scale-95 transition-all flex items-center justify-center gap-2 w-full md:w-auto">
      <i data-lucide="check" class="w-4 h-4"></i> Сохранить в график
    </button>
  </div>

  <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-6 rounded-[2rem] shadow-sm flex-1">
     <h3 class="text-lg font-bold mb-4">Предстоящие смены</h3>
     <div id="scheduleList" class="space-y-3">
        <div class="text-center text-gray-500 py-10 text-sm">Загрузка...</div>
     </div>
  </div>

</main>

<script>
  if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
  lucide.createIcons();

  let currentUser = null;
  let mySchedule = [];

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      loadSchedule();
    } else {
      window.location.href = 'index.html';
    }
  });

  async function loadSchedule() {
    try {
      const userDoc = await db.collection('users').doc(currentUser.uid).get();
      if (userDoc.exists && userDoc.data().schedule) {
        mySchedule = userDoc.data().schedule;
      } else {
        mySchedule = JSON.parse(localStorage.getItem('blocko_schedule')) || [];
      }
      renderSchedule();
    } catch(e) {
      mySchedule = JSON.parse(localStorage.getItem('blocko_schedule')) || [];
      renderSchedule();
    }
  }

  function renderSchedule() {
    const list = document.getElementById('scheduleList');
    
    // Сортируем по дате
    mySchedule.sort((a, b) => new Date(a.date) - new Date(b.date));

    if (mySchedule.length === 0) {
      list.innerHTML = '<div class="text-center text-gray-500 py-10 text-sm bg-gray-50 dark:bg-gray-800/50 rounded-2xl border border-dashed border-gray-200 dark:border-gray-700">График пуст. Добавьте смены выше.</div>';
      return;
    }

    list.innerHTML = mySchedule.map(s => `
      <div class="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-800/80 rounded-2xl border border-gray-200 dark:border-gray-700 transition-all hover:border-rose-300 dark:hover:border-rose-700">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-rose-100 dark:bg-rose-900/30 text-rose-500 rounded-xl flex items-center justify-center font-black text-sm flex-col leading-none">
            ${s.date.split('-')[2]}
          </div>
          <div>
            <h4 class="font-bold text-gray-900 dark:text-white">${s.title}</h4>
            <p class="text-xs text-gray-500 flex items-center gap-1 mt-1"><i data-lucide="clock" class="w-3 h-3"></i> ${s.timeStart} — ${s.timeEnd} (${s.date})</p>
          </div>
        </div>
        <button onclick="deleteScheduleItem('${s.id}')" class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition-colors">
          <i data-lucide="trash-2" class="w-5 h-5"></i>
        </button>
      </div>
    `).join('');
    lucide.createIcons();
  }

  async function addScheduleItem() {
    const title = document.getElementById('schTitle').value.trim() || 'Смена';
    const date = document.getElementById('schDate').value;
    const timeStart = document.getElementById('schStart').value;
    const timeEnd = document.getElementById('schEnd').value;

    if (!date) return alert('Пожалуйста, выберите дату');

    const newItem = {
      id: 'sch_' + Date.now(),
      title, date, timeStart, timeEnd
    };

    mySchedule.push(newItem);
    await saveSchedule();
    
    document.getElementById('schTitle').value = '';
    document.getElementById('schDate').value = '';
  }

  async function deleteScheduleItem(id) {
    mySchedule = mySchedule.filter(s => s.id !== id);
    await saveSchedule();
  }

  async function saveSchedule() {
    // Сохраняем локально и в облако
    localStorage.setItem('blocko_schedule', JSON.stringify(mySchedule));
    renderSchedule();
    
    if (navigator.onLine && currentUser) {
      try {
        await db.collection('users').doc(currentUser.uid).set({
          schedule: mySchedule
        }, { merge: true });
      } catch (e) {
        console.error("Ошибка сохранения в облако", e);
      }
    }
  }
</script>
</body>
</html>
