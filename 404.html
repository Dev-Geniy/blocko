<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Страница не найдена — Blocko Pro</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    
    /* Анимации парения для текста 404 */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-float { animation: float 6s ease-in-out infinite; }

    /* ENTERPRISE: Архитектура PWA-вьюпорта */
    html, body {
      height: 100dvh;
      width: 100%;
      overflow: hidden; /* Запрет глобального скролла */
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }
    
    /* Скрытие скроллбара для эстетики */
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { gray: { 950: '#0b0f19' } } } } }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 h-[100dvh] w-full flex flex-col transition-colors duration-300">
  
<!-- Фоновые неоновые блики -->
<div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-indigo-500/20 rounded-full blur-[120px] pointer-events-none -z-10"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-500/20 rounded-full blur-[120px] pointer-events-none -z-10"></div>

<!-- Минималистичный хедер -->
<header class="px-8 py-6 w-full absolute top-0 left-0 z-50 flex justify-between items-center">
  <div class="flex items-center gap-3">
    <div class="bg-gradient-to-br from-blue-500 to-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-blue-500/20">
      <i data-lucide="layers" class="w-5 h-5"></i>
    </div>
    <h1 class="text-xl font-bold tracking-tight">
      Blocko <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-indigo-500">Pro</span>
    </h1>
  </div>
  <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-white/50 dark:bg-gray-800/50 hover:bg-white dark:hover:bg-gray-700 text-gray-600 dark:text-gray-400 transition-colors shadow-sm backdrop-blur-md border border-gray-200/50 dark:border-gray-700/50">
    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i><i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
  </button>
</header>

<main class="flex-1 w-full relative z-10 overflow-y-auto hide-scroll flex flex-col">
  
  <div class="m-auto w-full max-w-4xl flex flex-col items-center justify-center p-6 mt-16 sm:mt-10">
    <div class="text-center mb-8 animate-float">
      
    <h1 class="text-[8rem] sm:text-[10rem] leading-none font-black text-transparent bg-clip-text bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 tracking-tighter drop-shadow-2xl select-none">
      404
    </h1>
    <h2 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white mt-2 mb-4 tracking-tight">
      Эта страница потерялась в облаках
    </h2>
    <p class="text-sm text-gray-500 dark:text-gray-400 font-medium max-w-lg mx-auto">
      Возможно, вы ввели неверный адрес или проект был удален. Пока мы ищем путь назад, попробуйте установить новый рекорд в <b class="text-indigo-500 dark:text-indigo-400">Blocko Runner</b>!
    </p>
  </div>

  <!-- Игровой контейнер (Blocko Runner) -->
  <div class="w-full bg-white dark:bg-gray-900 border-2 border-dashed border-indigo-200 dark:border-indigo-800/50 rounded-[2.5rem] shadow-2xl relative overflow-hidden group transition-colors">
    <!-- Игровой холст -->
    <canvas id="gameCanvas" width="800" height="250" class="w-full h-[200px] sm:h-[250px] block cursor-pointer"></canvas>
    
    <!-- Оверлей игры (Старт / Конец) -->
    <div id="gameOverlay" class="absolute inset-0 bg-white/60 dark:bg-black/60 backdrop-blur-[4px] flex flex-col items-center justify-center transition-opacity duration-300">
       <div class="w-16 h-16 bg-indigo-50 dark:bg-indigo-900/40 text-indigo-500 rounded-2xl flex items-center justify-center mb-4 shadow-inner border border-indigo-100 dark:border-indigo-800/50 animate-bounce">
         <i data-lucide="gamepad-2" class="w-8 h-8"></i>
       </div>
       <h3 id="gameMessage" class="text-xl font-black text-gray-900 dark:text-white mb-2">Нажмите ПРОБЕЛ, чтобы начать</h3>
       <p id="gameScoreText" class="text-xs font-bold text-gray-500 uppercase tracking-widest bg-gray-100 dark:bg-gray-800 px-3 py-1 rounded-lg">Лучший счет: 0</p>
    </div>
  </div>

  <div class="mt-10 flex flex-col sm:flex-row items-center gap-4 w-full justify-center">
    <a href="index.html" class="px-8 py-4 bg-gray-900 dark:bg-white text-white dark:text-gray-900 font-bold rounded-2xl shadow-lg hover:scale-105 active:scale-95 transition-all flex items-center justify-center gap-2 w-full sm:w-auto">
      <i data-lucide="home" class="w-5 h-5"></i> Вернуться в безопасность
    </a>
    <a href="javascript:history.back()" class="px-8 py-4 bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 font-bold rounded-2xl hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors active:scale-95 flex items-center justify-center gap-2 w-full sm:w-auto border border-gray-200 dark:border-gray-700">
      <i data-lucide="arrow-left-circle" class="w-5 h-5"></i> Шаг назад
    </a>
  </div>

  </div>
</main>

<script>
  // Тема
  if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
  function toggleTheme() {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    // Цвета в игре меняются динамически, перерисовываем
  }
  lucide.createIcons();

  // --- ДВИЖОК МИНИ-ИГРЫ BLOCKO RUNNER ---
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('gameOverlay');
  const msgText = document.getElementById('gameMessage');
  const scoreText = document.getElementById('gameScoreText');

  // Настройки игры
  let isPlaying = false;
  let score = 0;
  let highScore = localStorage.getItem('blocko_runner_highscore') || 0;
  scoreText.innerText = `Лучший счет: ${highScore}`;

  let frameCount = 0;
  let gameSpeed = 5;

  // Игрок (Блок)
  const player = {
    x: 50,
    y: 150,
    size: 30,
    dy: 0,
    jumpForce: 12,
    originalJumpForce: 12,
    gravity: 0.6,
    grounded: false
  };

  // Препятствия (Баги)
  let obstacles = [];

  function resetGame() {
    player.y = 150;
    player.dy = 0;
    obstacles = [];
    score = 0;
    gameSpeed = 5;
    frameCount = 0;
  }

  function startGame() {
    if (isPlaying) return;
    isPlaying = true;
    overlay.classList.add('opacity-0');
    setTimeout(() => overlay.classList.add('hidden'), 300);
    resetGame();
    requestAnimationFrame(update);
  }

  function gameOver() {
    isPlaying = false;
    overlay.classList.remove('hidden');
    setTimeout(() => overlay.classList.remove('opacity-0'), 10);
    
    msgText.innerText = `Игра окончена! Счет: ${score}`;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('blocko_runner_highscore', highScore);
      msgText.innerText = `Новый рекорд: ${score}! 🎉`;
    }
    scoreText.innerText = `Лучший счет: ${highScore} | Пробел для рестарта`;
  }

  function jump() {
    if (player.grounded && isPlaying) {
      player.dy = -player.jumpForce;
      player.grounded = false;
    } else if (!isPlaying) {
      startGame();
    }
  }

  // Управление
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      jump();
    }
  });
  canvas.addEventListener('mousedown', jump);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

  function spawnObstacle() {
    const minHeight = 20;
    const maxHeight = 50;
    const height = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
    
    obstacles.push({
      x: canvas.width,
      y: canvas.height - height - 20, // 20 = отступ снизу
      width: 20,
      height: height,
      passed: false
    });
  }

  function draw() {
    const isDark = document.documentElement.classList.contains('dark');
    
    // Очистка холста
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Отрисовка "Земли"
    ctx.fillStyle = isDark ? '#1e293b' : '#e2e8f0'; // gray-800 / gray-200
    ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

    // Отрисовка Игрока (Неоновый Блок)
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#6366f1'; // indigo-500
    ctx.fillStyle = '#8b5cf6'; // purple-500
    ctx.beginPath();
    ctx.roundRect(player.x, player.y, player.size, player.size, 6);
    ctx.fill();
    ctx.shadowBlur = 0; // Сброс теней для других объектов

    // Отрисовка Препятствий (Красные шипы/баги)
    obstacles.forEach(obs => {
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ef4444'; // red-500
      ctx.fillStyle = '#f43f5e'; // rose-500
      
      // Рисуем шип (треугольник)
      ctx.beginPath();
      ctx.moveTo(obs.x + obs.width / 2, obs.y);
      ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
      ctx.lineTo(obs.x, obs.y + obs.height);
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    // Отрисовка Счета
    ctx.fillStyle = isDark ? '#9ca3af' : '#6b7280'; // gray-400 / gray-500
    ctx.font = "bold 20px 'Plus Jakarta Sans', sans-serif";
    ctx.fillText(`Счет: ${score}`, 20, 40);
  }

  function update() {
    if (!isPlaying) return;

    // Физика игрока
    player.dy += player.gravity;
    player.y += player.dy;

    // Коллизия с землей
    if (player.y + player.size >= canvas.height - 20) {
      player.y = canvas.height - 20 - player.size;
      player.dy = 0;
      player.grounded = true;
    }

    // Генерация препятствий (ускоряется со временем)
    frameCount++;
    let spawnRate = Math.max(60, 120 - Math.floor(score / 5)); // Чем больше счет, тем чаще спавн
    
    if (frameCount % spawnRate === 0) {
      spawnObstacle();
    }

    // Обновление препятствий и проверка столкновений
    for (let i = 0; i < obstacles.length; i++) {
      let obs = obstacles[i];
      obs.x -= gameSpeed;

      // Точная коллизия (AABB)
      if (
        player.x < obs.x + obs.width &&
        player.x + player.size > obs.x &&
        player.y < obs.y + obs.height &&
        player.y + player.size > obs.y
      ) {
        gameOver();
        draw(); // Отрисовать последний кадр перед остановкой
        return;
      }

      // Начисление очков
      if (obs.x + obs.width < player.x && !obs.passed) {
        score++;
        obs.passed = true;
        // Ускоряем игру каждые 10 очков
        if (score % 10 === 0) gameSpeed += 0.5;
      }
    }

    // Удаление ушедших за экран препятствий
    obstacles = obstacles.filter(obs => obs.x + obs.width > 0);

    draw();
    requestAnimationFrame(update);
  }

  // Отрисовка первого кадра
  draw();
</script>
</body>
</html>
